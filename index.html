			/* ---
   BASE
---*/
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0
			}

			html {
				scroll-behavior: smooth
			}

			body {
				font-family: var(--font-ui);
				font-size: 13px;
				color: var(--fg);
				background-color: var(--bg);
				min-height: 100vh;
				line-height: 1.6;
				transition: background-color .3s, color .3s;
				position: relative;
			}

			body::before {
				content: '';
				position: fixed;
				inset: 0;
				background-image: var(--pape);
				background-size: cover;
				background-position: center;
				z-index: 0;
				pointer-events: none;
			}

			body::after {
				content: '';
				position: fixed;
				inset: 0;
				background: var(--pape-overlay);
				z-index: 0;
				pointer-events: none;
			}

			#app {
				position: relative;
				z-index: 1
			}

			a {
				color: var(--link);
				text-decoration: none
			}

			a:hover {
				text-decoration: underline
			}

			::-webkit-scrollbar {
				width: 3px;
				height: 3px
			}

			::-webkit-scrollbar-track {
				background: transparent
			}

			::-webkit-scrollbar-thumb {
				background: var(--bg4);
				border-radius: 10px
			}

			::-webkit-scrollbar-thumb:hover {
				background: var(--acc2)
			}

			::selection {
				background: var(--acc2);
				color: var(--bg)
			}

			/* ---
   BUTTONS
---*/
			.btn {
				display: inline-flex;
				align-items: center;
				gap: 5px;
				position: relative;
				padding: 4px 11px;
				font-family: var(--font-ui);
				font-size: 10.5px;
				letter-spacing: .5px;
				border: none;
				border-radius: var(--radius-md);
				cursor: pointer;
				overflow: hidden;
				transition: transform .1s, box-shadow .1s, filter .1s;
				user-select: none;
				outline: none;
				white-space: nowrap;
				text-transform: lowercase;
				background: linear-gradient(145deg, var(--btn-from), var(--btn-to));
				color: var(--btn-text);
				box-shadow: 0 1px 3px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
			}

			.btn::before {
				content: '';
				position: absolute;
				inset: 0;
				background: linear-gradient(180deg, rgba(255, 255, 255, .1) 0%, transparent 55%);
				pointer-events: none
			}

			.btn:hover {
				transform: translateY(-1px);
				filter: brightness(1.1);
				box-shadow: 0 3px 10px var(--shadow)
			}

			.btn:active {
				transform: scale(.97);
				filter: brightness(.93)
			}

			.btn-ghost {
				background: transparent;
				color: var(--fg3);
				box-shadow: none;
				border: 1px solid var(--border2)
			}

			.btn-ghost::before {
				display: none
			}

			.btn-ghost:hover {
				background: var(--bg3);
				color: var(--fg);
				border-color: var(--border3);
				box-shadow: none;
				filter: none
			}

			.btn-ghost:active {
				transform: scale(.97);
				box-shadow: none;
				filter: none
			}

			.btn-ghost.is-on {
				color: var(--acc3);
				border-color: var(--acc2);
				background: rgba(215, 153, 33, 0.08)
			}

			.btn-sm {
				padding: 3px 8px;
				font-size: 9.5px
			}

			.btn-xs {
				padding: 2px 6px;
				font-size: 9px;
				letter-spacing: .3px
			}

			/* ---
   HEADER
---*/
			#header {
				background: var(--bg1);
				border-bottom: 1px solid var(--border);
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 0 14px;
				height: 40px;
				z-index: 100;
				flex-shrink: 0;
				backdrop-filter: blur(12px);
			}

			.logo {
				font-family: var(--font-head);
				font-weight: 800;
				font-size: 14px;
				color: var(--acc3);
				letter-spacing: 4px;
				flex-shrink: 0;
				padding-right: 12px;
				border-right: 1px solid var(--border2);
			}

			#breadcrumb {
				display: flex;
				align-items: center;
				gap: 5px;
				font-size: 10.5px;
				color: var(--fg4);
				flex: 1;
				min-width: 0;
				overflow: hidden;
				white-space: nowrap;
			}

			#breadcrumb .crumb {
				color: var(--fg3);
				cursor: pointer;
				transition: color .12s
			}

			#breadcrumb .crumb:hover {
				color: var(--acc3)
			}

			#breadcrumb .sep {
				color: var(--bg4)
			}

			#breadcrumb .crumb-current {
				color: var(--fg2);
				font-style: italic;
				max-width: 300px;
				overflow: hidden;
				text-overflow: ellipsis
			}

			.header-right {
				display: flex;
				align-items: center;
				gap: 5px
			}

			/* ---
   LAYOUT
---*/
			#app {
				display: flex;
				flex-direction: column;
				min-height: 100vh
			}

			.app-body {
				display: flex;
				flex: 1;
				overflow: hidden;
				height: calc(100vh - 40px)
			}

			/* ---
   SIDEBAR
---*/
			#sidebar {
				width: 180px;
				flex-shrink: 0;
				background: var(--bg1);
				border-right: 1px solid var(--border);
				display: flex;
				flex-direction: column;
				overflow: hidden;
				transition: width .2s ease;
			}

			#sidebar.collapsed {
				width: 0;
				overflow: hidden
			}

			.sidebar-search {
				padding: 7px;
				border-bottom: 1px solid var(--border)
			}

			.sidebar-search input {
				width: 100%;
				background: var(--bg2);
				border: 1px solid var(--border2);
				color: var(--fg);
				padding: 5px 8px;
				font-family: var(--font-ui);
				font-size: 10.5px;
				border-radius: var(--radius-md);
				outline: none;
				transition: border-color .15s;
			}

			.sidebar-search input:focus {
				border-color: var(--acc2)
			}

			.sidebar-search input::placeholder {
				color: var(--fg4)
			}

			.sidebar-section-label {
				padding: 6px 10px 2px;
				font-size: 8.5px;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				color: var(--fg4)
			}

			.board-list {
				overflow-y: auto;
				flex: 1
			}

			.board-item {
				padding: 5px 10px 5px 10px;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: space-between;
				transition: background .1s;
				border-radius: 0;
			}

			.board-item:hover {
				background: var(--bg2)
			}

			.board-item.active {
				background: var(--bg2);
				color: var(--acc3)
			}

			.board-item .bn {
				font-weight: 500;
				font-size: 11.5px
			}

			.board-item .bt {
				font-size: 9.5px;
				color: var(--fg4);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				max-width: 110px
			}

			.board-item.active .bt {
				color: var(--acc2)
			}

			.board-item.active .bn {
				color: var(--acc3)
			}

			/* ---
   MAIN
---*/
			#main {
				flex: 1;
				overflow-y: auto;
				overflow-x: hidden;
				display: flex;
				flex-direction: column
			}

			/* ---
   TOPBAR
---*/
			.topbar {
				background: var(--bg1);
				border-bottom: 1px solid var(--border);
				padding: 5px 12px;
				display: flex;
				align-items: center;
				gap: 7px;
				flex-wrap: wrap;
				flex-shrink: 0;
				position: sticky;
				top: 0;
				z-index: 10;
				backdrop-filter: blur(8px);
			}

			.topbar-info {
				font-size: 10px;
				color: var(--fg4);
				flex: 0 0 auto
			}

			.topbar-spacer {
				flex: 1
			}

			.topbar select {
				background: var(--bg2);
				border: 1px solid var(--border2);
				color: var(--fg2);
				padding: 3px 7px;
				font-family: var(--font-ui);
				font-size: 10.5px;
				border-radius: var(--radius-md);
				cursor: pointer;
				outline: none;
			}

			.topbar input[type=text] {
				background: var(--bg2);
				border: 1px solid var(--border2);
				color: var(--fg);
				padding: 4px 10px;
				font-family: var(--font-ui);
				font-size: 10.5px;
				border-radius: var(--radius-md);
				outline: none;
				width: 160px;
			}

			.topbar input[type=text]:focus {
				border-color: var(--acc2)
			}

			.topbar input[type=text]::placeholder {
				color: var(--fg4)
			}

			/* ---
   STARTPAGE
---*/
			#view-start {
				padding: 28px 22px 24px;
				flex: 1
			}

			.start-hero {
				margin-bottom: 24px
			}

			.start-hero h1 {
				font-family: var(--font-accent);
				font-size: 36px;
				font-weight: 300;
				color: var(--fg);
				line-height: 1.1;
				letter-spacing: -.5px
			}

			.start-hero h1 em {
				font-style: italic;
				color: var(--acc3)
			}

			.start-hero p {
				font-family: var(--font-body);
				font-size: 15px;
				color: var(--fg3);
				margin-top: 7px
			}

			.start-stats {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
				gap: 8px;
				margin-bottom: 22px
			}

			.stat-card {
				background: var(--bg1);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				padding: 12px 14px;
				transition: border-color .15s, transform .15s
			}

			.stat-card:hover {
				border-color: var(--border3);
				transform: translateY(-1px)
			}

			.stat-card .sv {
				font-family: var(--font-accent);
				font-size: 26px;
				font-weight: 300;
				color: var(--acc3);
				line-height: 1;
				margin-bottom: 3px
			}

			.stat-card .sl {
				font-size: 9.5px;
				color: var(--fg4);
				letter-spacing: .8px;
				text-transform: uppercase
			}

			.section-label {
				font-size: 9.5px;
				letter-spacing: 1.5px;
				text-transform: uppercase;
				color: var(--fg4);
				margin-bottom: 8px;
				display: flex;
				align-items: center;
				gap: 8px
			}

			.section-label::after {
				content: '';
				flex: 1;
				height: 1px;
				background: var(--border)
			}

			.boards-grid {
				display: flex;
				flex-wrap: wrap;
				gap: 4px
			}

			.start-board-btn {
				background: var(--bg1);
				border: 1px solid var(--border);
				color: var(--fg3);
				padding: 4px 10px;
				font-family: var(--font-ui);
				font-size: 10.5px;
				border-radius: var(--radius-md);
				cursor: pointer;
				transition: background .12s, border-color .12s, color .12s;
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 1px;
				min-width: 50px
			}

			.start-board-btn:hover {
				background: var(--bg3);
				border-color: var(--border3);
				color: var(--fg)
			}

			.start-board-btn .sbn {
				font-weight: 500;
				color: var(--acc);
				font-size: 11px
			}

			.start-board-btn .sbt {
				font-size: 8.5px;
				color: var(--fg4);
				white-space: nowrap;
				max-width: 85px;
				overflow: hidden;
				text-overflow: ellipsis
			}

			.start-chart {
				background: var(--bg1);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				padding: 14px;
				margin-bottom: 18px
			}

			.start-chart h3 {
				font-family: var(--font-ui);
				font-size: 10px;
				color: var(--fg4);
				letter-spacing: 1px;
				text-transform: uppercase;
				margin-bottom: 10px
			}

			.chart-bars {
				display: flex;
				align-items: flex-end;
				gap: 3px;
				height: 72px
			}

			.chart-bar-wrap {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 2px;
				flex: 1
			}

			.chart-bar {
				width: 100%;
				background: linear-gradient(180deg, var(--acc3), var(--acc2));
				border-radius: 2px 2px 0 0;
				min-height: 2px;
				transition: height .5s cubic-bezier(.4, 0, .2, 1);
				position: relative;
				cursor: pointer
			}

			.chart-bar:hover::after {
				content: attr(data-val);
				position: absolute;
				bottom: calc(100% + 3px);
				left: 50%;
				transform: translateX(-50%);
				background: var(--bg4);
				color: var(--fg);
				padding: 2px 5px;
				font-size: 8.5px;
				border-radius: 2px;
				white-space: nowrap
			}

			.chart-label {
				font-size: 7.5px;
				color: var(--fg4);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 100%;
				text-align: center
			}

			/* ---
   CATALOG
---*/
			#view-catalog {
				padding: 10px;
				flex: 1
			}

			.catalog-grid-large {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
				gap: 9px
			}

			.catalog-grid-small {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
				gap: 7px
			}

			.c-card {
				background: var(--bg1);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				overflow: hidden;
				cursor: pointer;
				transition: border-color .15s, transform .12s, box-shadow .12s;
				position: relative;
				display: flex;
				flex-direction: column
			}

			.c-card:hover {
				border-color: var(--border3);
				transform: translateY(-2px);
				box-shadow: 0 8px 24px var(--shadow2)
			}

			.c-card-img {
				width: 100%;
				aspect-ratio: 4/3;
				overflow: hidden;
				background: var(--bg2);
				position: relative;
				flex-shrink: 0
			}

			.c-card-img img {
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: block;
				transition: transform .2s ease
			}

			.c-card:hover .c-card-img img {
				transform: scale(1.04)
			}

			.c-card-img .no-img {
				width: 100%;
				height: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 10.5px;
				color: var(--fg4)
			}

			.c-card-overlay {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				background: linear-gradient(transparent, rgba(0, 0, 0, .7));
				padding: 14px 7px 5px;
				display: flex;
				justify-content: space-between;
				align-items: flex-end
			}

			.c-card-stat {
				font-family: var(--font-ui);
				font-size: 8.5px;
				color: rgba(255, 255, 255, .9);
				background: rgba(0, 0, 0, .35);
				padding: 2px 5px;
				border-radius: 2px;
				display: flex;
				gap: 7px;
				backdrop-filter: blur(4px)
			}

			.c-card-body {
				padding: 7px 8px 8px;
				flex: 1;
				display: flex;
				flex-direction: column;
				gap: 3px
			}

			.c-card-sub {
				font-family: var(--font-ui);
				font-weight: 500;
				font-size: 11px;
				color: var(--acc3);
				overflow: hidden;
				white-space: nowrap;
				text-overflow: ellipsis
			}

			.c-card-preview {
				font-family: var(--font-body);
				font-size: 11.5px;
				color: var(--fg3);
				overflow: hidden;
				display: -webkit-box;
				-webkit-line-clamp: 3;
				-webkit-box-orient: vertical;
				line-height: 1.4;
				flex: 1
			}

			.c-card-footer {
				display: flex;
				justify-content: space-between;
				align-items: center;
				margin-top: 3px
			}

			.c-card-stats {
				font-size: 9px;
				color: var(--fg4);
				display: flex;
				gap: 7px
			}

			.c-card-stats .r {
				color: var(--green2)
			}

			.c-card-stats .i {
				color: var(--blue2)
			}

			/* ---
   THREAD — MESSENGER / IMAGEBOARD HYBRID
---*/
			#view-thread {
				flex: 1;
				display: flex;
				flex-direction: column
			}

			#thread-scroll {
				padding: 14px 16px 20px;
				overflow-y: auto;
				flex: 1
			}

			#thread-posts {
				display: flex;
				flex-direction: column;
				gap: 0
			}

			/* OP post — full-width card */
			.post-op-wrap {
				background: var(--bg1);
				border: 1px solid var(--border2);
				border-radius: var(--radius-xl);
				padding: 14px 16px;
				margin-bottom: 16px;
				box-shadow: 0 0 0 1px var(--op-glow), 0 4px 24px var(--shadow2);
				position: relative;
			}

			.post-op-accent {
				position: absolute;
				left: 0;
				top: 12px;
				bottom: 12px;
				width: 3px;
				border-radius: 0 2px 2px 0;
				background: linear-gradient(180deg, var(--acc3), var(--acc2));
				opacity: .7;
			}

			/* Reply tree container */
			.reply-tree {
				display: flex;
				flex-direction: column;
				gap: 1px;
				padding-left: 18px;
				position: relative;
				margin-bottom: 4px;
			}

			.reply-tree::before {
				content: '';
				position: absolute;
				left: 6px;
				top: 0;
				bottom: 0;
				width: 1px;
				background: var(--border2);
				pointer-events: none;
			}

			/* Individual reply — messenger bubble style */
			.post-reply-wrap {
				display: flex;
				gap: 0;
				position: relative;
				padding: 0;
			}

			.post-reply-wrap::before {
				content: '';
				position: absolute;
				left: -12px;
				top: 16px;
				width: 10px;
				height: 1px;
				background: var(--border2);
			}

			.post-bubble {
				background: var(--msg-bg);
				border: 1px solid var(--msg-border);
				border-radius: var(--radius-lg);
				padding: 8px 11px;
				flex: 1;
				min-width: 0;
				backdrop-filter: blur(8px);
				transition: border-color .12s, background .12s;
			}

			.post-bubble:hover {
				border-color: var(--border2)
			}

			/* Nested replies indentation */
			.reply-tree .reply-tree {
				padding-left: 16px;
				margin-left: 0;
			}

			.reply-tree .reply-tree::before {
				left: 5px
			}

			/* Post header */
			.post-meta {
				display: flex;
				align-items: center;
				flex-wrap: wrap;
				gap: 5px;
				margin-bottom: 5px;
				font-size: 10.5px;
			}

			.post-subject {
				font-family: var(--font-head);
				font-weight: 600;
				font-size: 16px;
				color: var(--green2);
				margin-bottom: 4px;
				line-height: 1.2
			}

			.post-id {
				font-family: var(--font-ui);
				font-size: 9.5px;
				padding: 1px 5px;
				border-radius: var(--radius)
			}

			.post-time {
				font-size: 9.5px;
				color: var(--fg4)
			}

			.post-no {
				font-family: var(--font-ui);
				font-size: 10px;
				color: var(--fg4);
				cursor: pointer;
				transition: color .12s;
				padding: 0 2px;
			}

			.post-no:hover {
				color: var(--acc3)
			}

			.reply-count-badge {
				font-size: 9px;
				color: var(--blue2);
				background: rgba(69, 133, 136, 0.15);
				padding: 1px 5px;
				border-radius: 10px;
				cursor: pointer;
			}

			.post-actions-inline {
				margin-left: auto;
				display: flex;
				gap: 2px;
				opacity: 0;
				transition: opacity .15s
			}

			.post-bubble:hover .post-actions-inline,
			.post-op-wrap:hover .post-actions-inline {
				opacity: 1
			}

			/* Post body */
			.post-body {
				display: flex;
				gap: 11px;
				align-items: flex-start
			}

			.post-image img {
				max-width: 320px;
				max-height: 320px;
				width: auto;
				height: auto;
				object-fit: contain;
				display: block;
				cursor: zoom-in;
				border-radius: var(--radius-md);
				transition: opacity .15s;
			}

			.post-image img:hover {
				opacity: .88
			}

			.post-video video {
				max-width: 420px;
				max-height: 380px;
				width: 100%;
				border-radius: var(--radius-md)
			}

			.post-comment {
				flex: 1;
				min-width: 0;
				word-break: break-word;
				line-height: 1.65;
				font-family: var(--font-body);
				font-size: 13.5px;
				color: var(--fg2);
			}

			.post-comment .quote {
				color: var(--quote)
			}

			.post-comment .quotelink {
				color: var(--link);
				cursor: pointer;
				transition: opacity .1s;
				text-decoration: none;
				font-family: var(--font-ui);
				font-size: 11.5px;
				background: rgba(215, 153, 33, 0.08);
				padding: 0 3px;
				border-radius: 2px;
			}

			.post-comment .quotelink:hover {
				opacity: .75;
				text-decoration: underline
			}

			.post-comment s {
				text-decoration: line-through;
				color: var(--fg4)
			}

			.post-comment code {
				background: var(--bg3);
				padding: 1px 4px;
				border-radius: 2px;
				font-family: var(--font-ui);
				font-size: 11.5px
			}

			/* Reply links under post */
			.post-reply-links {
				margin-top: 5px;
				display: flex;
				flex-wrap: wrap;
				gap: 4px;
				padding-top: 5px;
				border-top: 1px solid var(--border);
			}

			.reply-link-item {
				font-family: var(--font-ui);
				font-size: 10px;
				color: var(--link);
				cursor: pointer;
				background: rgba(215, 153, 33, 0.06);
				padding: 1px 6px;
				border-radius: 10px;
				border: 1px solid rgba(215, 153, 33, 0.15);
				transition: background .12s, border-color .12s;
				position: relative;
			}

			.reply-link-item:hover {
				background: rgba(215, 153, 33, 0.14);
				border-color: rgba(215, 153, 33, 0.3)
			}

			/* Highlighted */
			.is-highlighted {
				outline: 2px solid var(--acc);
				border-radius: var(--radius-lg);
				animation: flashPost 1.5s ease-out forwards
			}

			@keyframes flashPost {
				0% {
					outline-color: var(--acc3)
				}

				100% {
					outline-color: transparent
				}
			}

			/* Hidden stub */
			.post-hidden-stub {
				padding: 5px 11px;
				border: 1px dashed var(--border2);
				font-size: 10.5px;
				color: var(--fg4);
				cursor: pointer;
				display: flex;
				align-items: center;
				gap: 6px;
				border-radius: var(--radius-lg);
				margin: 2px 0;
				transition: border-color .12s, color .12s;
			}

			.post-hidden-stub:hover {
				border-color: var(--acc2);
				color: var(--fg3)
			}

			/* ---
   HOVER PREVIEW
---*/
			#hover-preview {
				position: fixed;
				z-index: 9000;
				pointer-events: none;
				display: none;
				opacity: 0;
				transition: opacity .15s
			}

			#hover-preview.visible {
				display: block;
				opacity: 1
			}

			.preview-card {
				background: var(--bg1);
				border: 1px solid var(--border3);
				border-radius: var(--radius-lg);
				padding: 10px 12px;
				max-width: 340px;
				min-width: 200px;
				box-shadow: 0 12px 40px var(--shadow), 0 2px 8px var(--shadow2);
				font-size: 11.5px;
				backdrop-filter: blur(12px);
			}

			.preview-header {
				font-size: 9.5px;
				color: var(--fg4);
				margin-bottom: 5px;
				display: flex;
				gap: 7px;
				align-items: center
			}

			.preview-body {
				font-family: var(--font-body);
				font-size: 12.5px;
				color: var(--fg2);
				line-height: 1.5
			}

			.preview-body .quote {
				color: var(--quote)
			}

			.preview-img {
				margin-bottom: 7px;
				max-height: 140px;
				overflow: hidden;
				border-radius: var(--radius-md)
			}

			.preview-img img {
				width: 100%;
				height: 140px;
				object-fit: cover
			}

			.preview-notfound {
				color: var(--fg4);
				font-style: italic
			}

			/* ---
   FLUENT CONTEXT MENU — Windows 11 inspired
---*/
			#ctx-menu {
				position: fixed;
				z-index: 9999;
				display: none;
				background: var(--bg1);
				border: 1px solid var(--border2);
				border-radius: var(--radius-xl);
				padding: 6px;
				box-shadow: 0 16px 48px var(--shadow), 0 4px 16px var(--shadow2), inset 0 1px 0 rgba(255, 255, 255, 0.04);
				min-width: 200px;
				max-width: 280px;
				backdrop-filter: blur(20px) saturate(1.5);
				animation: ctxIn .12s cubic-bezier(.1, .9, .2, 1);
			}

			@keyframes ctxIn {
				from {
					opacity: 0;
					transform: scale(.93) translateY(-4px)
				}

				to {
					opacity: 1;
					transform: scale(1) translateY(0)
				}
			}

			.ctx-group {
				padding: 3px 0
			}

			.ctx-group+.ctx-group {
				border-top: 1px solid var(--border);
				margin-top: 3px;
				padding-top: 6px
			}

			.ctx-item {
				padding: 7px 10px;
				font-size: 11.5px;
				color: var(--fg2);
				cursor: pointer;
				display: flex;
				align-items: center;
				gap: 9px;
				border-radius: var(--radius-md);
				transition: background .08s;
				user-select: none;
			}

			.ctx-item:hover {
				background: var(--bg3);
				color: var(--fg)
			}

			.ctx-item:active {
				background: var(--bg4);
				transform: scale(.98)
			}

			.ctx-item.danger:hover {
				background: rgba(204, 36, 29, .15);
				color: var(--red2)
			}

			.ctx-icon {
				width: 20px;
				height: 20px;
				border-radius: var(--radius);
				background: var(--bg3);
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 11px;
				color: var(--fg3);
				flex-shrink: 0;
			}

			.ctx-item:hover .ctx-icon {
				background: var(--bg4);
				color: var(--fg)
			}

			.ctx-item.danger:hover .ctx-icon {
				background: rgba(204, 36, 29, .2);
				color: var(--red2)
			}

			.ctx-label {
				flex: 1
			}

			.ctx-shortcut {
				font-size: 9.5px;
				color: var(--fg4);
				letter-spacing: .3px
			}

			.ctx-header {
				padding: 6px 10px 4px;
				font-size: 9px;
				letter-spacing: 1px;
				text-transform: uppercase;
				color: var(--fg4);
			}

			/* ---
   LIGHTBOX
---*/
			#lightbox {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, .92);
				display: none;
				z-index: 9990;
				align-items: center;
				justify-content: center;
				cursor: zoom-out
			}

			#lightbox.open {
				display: flex
			}

			#lightbox img,
			#lightbox video {
				max-width: 95vw;
				max-height: 95vh;
				object-fit: contain;
				border-radius: var(--radius-md)
			}

			#lightbox-close {
				position: fixed;
				top: 14px;
				right: 18px;
				font-family: var(--font-ui);
				font-size: 18px;
				color: rgba(255, 255, 255, .5);
				cursor: pointer;
				user-select: none;
				transition: color .12s;
				background: rgba(0, 0, 0, .4);
				padding: 4px 9px;
				border-radius: var(--radius-md)
			}

			#lightbox-close:hover {
				color: #fff;
				background: rgba(0, 0, 0, .65)
			}

			#lightbox-info {
				position: fixed;
				bottom: 14px;
				left: 50%;
				transform: translateX(-50%);
				font-size: 10.5px;
				color: rgba(255, 255, 255, .4);
				background: rgba(0, 0, 0, .4);
				padding: 3px 10px;
				border-radius: var(--radius-md)
			}

			/* ---
   MODALS
---*/
			#theme-modal,
			#filters-modal {
				position: fixed;
				inset: 0;
				background: rgba(0, 0, 0, .55);
				z-index: 10000;
				display: none;
				align-items: center;
				justify-content: center;
				padding: 20px;
				backdrop-filter: blur(6px)
			}

			#theme-modal.open,
			#filters-modal.open {
				display: flex
			}

			.modal-panel {
				background: var(--bg1);
				border: 1px solid var(--border2);
				border-radius: var(--radius-xl);
				padding: 18px 20px;
				width: 100%;
				max-width: 660px;
				max-height: 86vh;
				overflow-y: auto;
				box-shadow: 0 24px 64px rgba(0, 0, 0, .65);
				backdrop-filter: blur(12px);
			}

			.modal-title {
				font-family: var(--font-head);
				font-size: 15px;
				font-weight: 600;
				color: var(--fg);
				margin-bottom: 16px;
				display: flex;
				align-items: center;
				justify-content: space-between
			}

			.modal-close-btn {
				background: none;
				border: none;
				color: var(--fg4);
				cursor: pointer;
				font-size: 15px;
				padding: 2px 7px;
				border-radius: var(--radius-md);
				transition: color .12s, background .12s
			}

			.modal-close-btn:hover {
				color: var(--fg);
				background: var(--bg3)
			}

			.theme-grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
				gap: 8px;
				margin-bottom: 16px
			}

			.theme-card {
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				overflow: hidden;
				cursor: pointer;
				transition: border-color .15s, transform .12s, box-shadow .12s
			}

			.theme-card:hover {
				border-color: var(--border3);
				transform: translateY(-2px);
				box-shadow: 0 4px 18px var(--shadow)
			}

			.theme-card.active {
				border-color: var(--acc);
				box-shadow: 0 0 0 2px var(--acc2)
			}

			.theme-preview {
				height: 66px;
				position: relative;
				overflow: hidden
			}

			.theme-preview-bg {
				width: 100%;
				height: 100%;
				position: relative
			}

			.theme-preview-bars {
				position: absolute;
				bottom: 0;
				left: 0;
				right: 0;
				display: flex;
				height: 12px
			}

			.theme-preview-bars div {
				flex: 1
			}

			.theme-card-body {
				padding: 5px 7px;
				background: var(--bg1)
			}

			.theme-card-name {
				font-size: 10.5px;
				font-weight: 500;
				color: var(--fg2);
				margin-bottom: 1px
			}

			.theme-card-desc {
				font-size: 8.5px;
				color: var(--fg4)
			}

			.theme-card-fonts {
				font-size: 7.5px;
				color: var(--fg4);
				margin-top: 1px;
				opacity: .65
			}

			.modal-section {
				margin-bottom: 18px
			}

			.modal-section-label {
				font-size: 9.5px;
				color: var(--fg4);
				letter-spacing: 1.2px;
				text-transform: uppercase;
				margin-bottom: 8px;
				padding-bottom: 5px;
				border-bottom: 1px solid var(--border)
			}

			.settings-row {
				display: flex;
				align-items: center;
				gap: 9px;
				margin-bottom: 7px;
				font-size: 11.5px;
				color: var(--fg3)
			}

			.settings-row label {
				min-width: 200px
			}

			.settings-row input[type=text] {
				flex: 1;
				background: var(--bg2);
				border: 1px solid var(--border2);
				color: var(--fg);
				padding: 4px 8px;
				font-family: var(--font-ui);
				font-size: 10.5px;
				border-radius: var(--radius-md);
				outline: none
			}

			.settings-row input[type=text]:focus {
				border-color: var(--acc2)
			}

			.toggle {
				position: relative;
				width: 32px;
				height: 17px;
				flex-shrink: 0
			}

			.toggle input {
				opacity: 0;
				width: 0;
				height: 0
			}

			.toggle-slider {
				position: absolute;
				inset: 0;
				background: var(--bg3);
				border-radius: 17px;
				transition: background .2s;
				cursor: pointer
			}

			.toggle-slider::before {
				content: '';
				position: absolute;
				left: 3px;
				top: 3px;
				width: 11px;
				height: 11px;
				background: var(--fg3);
				border-radius: 50%;
				transition: transform .2s, background .2s
			}

			.toggle input:checked+.toggle-slider {
				background: var(--acc2)
			}

			.toggle input:checked+.toggle-slider::before {
				transform: translateX(15px);
				background: var(--btn-text)
			}

			.pape-url-row {
				flex-direction: column;
				align-items: flex-start;
				gap: 5px
			}

			.pape-url-row label {
				min-width: auto
			}

			.pape-url-row input {
				width: 100%
			}

			/* ---
   STATUS BAR
---*/
			#statusbar {
				background: var(--bg1);
				border-top: 1px solid var(--border);
				padding: 3px 12px;
				display: flex;
				align-items: center;
				gap: 12px;
				font-size: 9.5px;
				color: var(--fg4);
				flex-shrink: 0;
				letter-spacing: .2px;
			}

			.status-dot {
				width: 5px;
				height: 5px;
				border-radius: 50%;
				background: var(--green);
				animation: pulse 2.5s infinite;
				display: inline-block;
				margin-right: 4px
			}

			@keyframes pulse {

				0%,
				100% {
					opacity: 1
				}

				50% {
					opacity: .3
				}
			}

			.status-sep {
				color: var(--bg4)
			}

			#status-proxy {
				color: var(--blue2);
				cursor: pointer
			}

			#status-proxy:hover {
				color: var(--blue)
			}

			/* ---
   MISC
---*/
			.view {
				display: none
			}

			.view.active {
				display: flex;
				flex-direction: column
			}

			.empty-state {
				padding: 36px 18px;
				text-align: center;
				color: var(--fg4);
				font-family: var(--font-body);
				font-size: 14.5px;
				font-style: italic
			}

			#back-to-top {
				position: fixed;
				bottom: 34px;
				right: 16px;
				z-index: 500;
				display: none
			}

			#back-to-top.visible {
				display: block
			}

			.id-red {
				background: rgba(204, 36, 29, .16);
				color: var(--red2)
			}

			.id-green {
				background: rgba(152, 151, 26, .16);
				color: var(--green2)
			}

			.id-blue {
				background: rgba(69, 133, 136, .16);
				color: var(--blue2)
			}

			.id-purple {
				background: rgba(177, 98, 134, .16);
				color: var(--purple)
			}

			.id-default {
				background: var(--bg3);
				color: var(--fg3)
			}

			/* Reply popover */
			#reply-popover {
				position: fixed;
				z-index: 8500;
				display: none;
				background: var(--bg2);
				border: 1px solid var(--border2);
				border-radius: var(--radius-lg);
				padding: 6px 10px;
				font-size: 10.5px;
				color: var(--fg3);
				box-shadow: 0 6px 20px var(--shadow);
				pointer-events: auto
			}

			#reply-popover .rp-title {
				font-size: 8.5px;
				color: var(--fg4);
				margin-bottom: 3px;
				letter-spacing: .5px
			}

			#reply-popover .rp-link {
				color: var(--link);
				cursor: pointer;
				margin-right: 5px;
				transition: color .1s
			}

			#reply-popover .rp-link:hover {
				color: var(--acc3);
				text-decoration: underline
			}

		</style>
	</head>

			const state = {

			const PREF_KEY = 'chanReader_prefs_v4';

			function loadPrefs() {
				try {
					return JSON.parse(localStorage.getItem(PREF_KEY)) || {}
				} catch {
					return {}
				}
			}

			function saveAllPrefs() {
				localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs))
			}

			function savePref(k, v) {
				state.prefs[k] = v;
				saveAllPrefs()
			}

			function getPref(k, def) {
				return k in state.prefs ? state.prefs[k] : def
			}
			async function apiFetch(url) {
				const r = await fetch(url);
				if (!r.ok) throw new Error(`HTTP ${r.status}`);
				return r.json()
			}

			function showView(name) {
				document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
				const el = document.getElementById(`view-${name}`);

				state.view = name;

			function setDocTitle(t) {
				document.title = t || 'CHAN — reader'
			}

			function updateBreadcrumb(parts) {
				const el = document.getElementById('breadcrumb');
				el.innerHTML = parts.map((p, i) => {
					if (i < parts.length - 1) return `<span class="crumb" onclick="${p.fn||''}">${p.label}</span><span class="sep">›</span>`;
					return `<span class="crumb-current">${p.label}</span>`;
				}).join('');

			// --- STARTPAGE ---------------------------------------------------------
			async function goStart() {
				showView('start');
				setDocTitle('CHAN — reader');
				updateBreadcrumb([{
					label: 'home'
				}]);
				updateStatus('loading boards…');
				try {
					const data = await apiFetch(Url.boards());
					state.boardList = data.boards;
					const ws = data.boards.filter(b => b.ws_board === 1);
					const nws = data.boards.filter(b => b.ws_board === 0);

					document.getElementById('stat-wsboards').textContent = ws.length;
					document.getElementById('stat-nsboards').textContent = nws.length;
					document.getElementById('stat-threads').textContent = '—';
					const mk = list => list.map(b => `<button class="start-board-btn" onclick="goCatalog('${b.board}')"><span class="sbn">/${b.board}/</span><span class="sbt">${b.title}</span></button>`).join('');

					document.getElementById('start-nws-boards').innerHTML = mk(nws);
					document.getElementById('start-boards-section').style.display = '';

			}

			function buildStartChart(boards) {
				const data = boards.map(b => ({
					name: `/${b.board}/`,
					val: (b.per_page * b.pages) || Math.floor(Math.random() * 200 + 50)
				}));

				document.getElementById('chart-bars').innerHTML = data.map(d => `
    <div class="chart-bar-wrap">
      <div class="chart-bar" style="height:${Math.round((d.val/max)*66)}px" data-val="${d.val}" onclick="goCatalog('${d.name.replace(/\//g,'')}')"></div>
      <div class="chart-label">${d.name}</div>
    </div>`).join('');
				document.getElementById('start-chart').style.display = '';
			}

			function buildSidebar(boards) {
				const ws = boards.filter(b => b.ws_board === 1);
				const nws = boards.filter(b => b.ws_board === 0);
				document.getElementById('sidebar-board-list').innerHTML = `
    <div class="sidebar-section-label">worksafe</div>
    ${ws.map(b=>sidebarItem(b)).join('')}
    <div class="sidebar-section-label" style="margin-top:7px">not worksafe</div>
    ${nws.map(b=>sidebarItem(b)).join('')}`;
			}

			function sidebarItem(b) {
				return `<div class="board-item" id="sbi-${b.board}" onclick="goCatalog('${b.board}')">
    <div><div class="bn">/${b.board}/</div><div class="bt">${b.title}</div></div>
  </div>`;
			}

			function filterBoards(q) {
				q = q.toLowerCase();
				document.querySelectorAll('.board-item').forEach(el => {
					el.style.display = q && !el.textContent.toLowerCase().includes(q) ? 'none' : '';
				});
			}
			// --- CATALOG ------------------------------------------------------------
			let catalogRawThreads = [];
			async function goCatalog(board) {
				state.board = board;
				state.threadNo = null;
				showView('catalog');
				setDocTitle(`/${board}/ — CHAN`);
				updateBreadcrumb([{
					label: 'home',
					fn: 'goStart()'
				}, {
					label: `/${board}/`
				}]);
				document.querySelectorAll('.board-item').forEach(el => el.classList.remove('active'));
				const sbi = document.getElementById(`sbi-${board}`);
				if (sbi) sbi.classList.add('active');
				document.getElementById('catalog-info').textContent = `loading /${board}/…`;
				document.getElementById('catalog-grid').innerHTML = '<div class="empty-state">loading threads…</div>';
				updateStatus(`fetching /${board}/ catalog…`);
				try {
					const pages = await apiFetch(Url.catalog(board));
					catalogRawThreads = pages.flatMap(p => p.threads);
					renderCatalogFiltered();
					updateStatus(`/${board}/ — ${catalogRawThreads.length} threads`);
				} catch (err) {
					document.getElementById('catalog-grid').innerHTML = `<div class="empty-state">error: ${err.message}</div>`;
					updateStatus(`error: ${err.message}`);
				}
			}

			function renderCatalogFiltered() {
				let threads = [...catalogRawThreads];
				const noSub = document.getElementById('f-nosub').checked;
				const noImg = document.getElementById('f-noimg').checked;
				const block = document.getElementById('f-block').value.split(',').map(x => x.trim().toLowerCase()).filter(Boolean);
				const search = document.getElementById('catalog-search').value.trim().toLowerCase();
				threads = threads.filter(t => {
					if (noSub && !t.sub) return false;
					if (noImg && !t.tim) return false;
					const text = `${t.sub||''} ${stripHtml(t.com||'')}`.toLowerCase();
					if (block.some(w => text.includes(w))) return false;
					if (search && !text.includes(search)) return false;
					return true;
				});
				const sort = document.getElementById('sort-select').value;
				if (sort === 'replies') threads.sort((a, b) => (b.replies || 0) - (a.replies || 0));
				else if (sort === 'images') threads.sort((a, b) => (b.images || 0) - (a.images || 0));
				else if (sort === 'newest') threads.sort((a, b) => b.no - a.no);
				else if (sort === 'oldest') threads.sort((a, b) => a.no - b.no);
				document.getElementById('catalog-info').textContent = `/${state.board}/ — ${threads.length} / ${catalogRawThreads.length} threads`;
				const isLarge = getPref('largeCatalog', true);
				const grid = document.getElementById('catalog-grid');
				grid.className = isLarge ? 'catalog-grid-large' : 'catalog-grid-small';
				grid.innerHTML = threads.map(t => renderCard(t)).join('');
			}

			function renderCard(t) {
				const imgHtml = t.tim ? `<img src="${Url.thumb(state.board,t.tim)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-img>no image</div>'">` : `<div class="no-img">no image</div>`;
				const preview = stripHtml(t.com || '').slice(0, 175);
				const sub = t.sub ? `<div class="c-card-sub">${t.sub}</div>` : '';
				return `<div class="c-card" onclick="goThread(${t.no})" oncontextmenu="showCardCtx(event,${t.no},'${(t.sub||'').replace(/'/g,"\\'")}')">
    <div class="c-card-img">${imgHtml}<div class="c-card-overlay"><div class="c-card-stat"><span class="r">↑${t.replies||0}</span><span class="i">⬡${t.images||0}</span></div></div></div>
    <div class="c-card-body">${sub}<div class="c-card-preview">${preview}</div></div>
  </div>`;
			}

			function onSortChange(v) {
				savePref('catalogSort', v);
				renderCatalogFiltered()
			}

			function onSearchInput() {
				renderCatalogFiltered()
			}

				renderCatalogFiltered()

			function setCatalogSize(size) {
				savePref('largeCatalog', size === 'large');

			}
			// --- THREAD ---
			async function goThread(no) {
				state.threadNo = no;
				showView('thread');
				updateBreadcrumb([{
					label: 'home',
					fn: 'goStart()'
				}, {
					label: `/${state.board}/`,
					fn: `goCatalog('${state.board}')`
				}, {
					label: `#${no}`
				}]);
				document.getElementById('thread-info').textContent = `loading thread #${no}…`;
				document.getElementById('thread-posts').innerHTML = '<div class="empty-state">loading…</div>';
				updateStatus(`fetching thread #${no}…`);
				try {
					const data = await apiFetch(Url.thread(state.board, no));
					state.posts = data.posts;
					state.replyMap = buildReplyMap(data.posts);
					state.hiddenPosts.clear();
					const firstPost = data.posts[0];
					const sub = firstPost.sub || `thread #${no}`;
					setDocTitle(`/${state.board}/ — ${sub} — CHAN`);
					updateBreadcrumb([{
						label: 'home',
						fn: 'goStart()'
					}, {
						label: `/${state.board}/`,
						fn: `goCatalog('${state.board}')`
					}, {
						label: sub
					}]);
					document.getElementById('thread-info').textContent = `#${no} — ${data.posts.length} posts`;
					updateStatus(`${data.posts.length} posts`);
					renderThread();
				} catch (err) {
					document.getElementById('thread-posts').innerHTML = `<div class="empty-state">error: ${err.message}</div>`;
					updateStatus(`error: ${err.message}`);
				}
			}
			async function refreshThread() {
				if (state.threadNo) await goThread(state.threadNo)
			}

			function buildReplyMap(posts) {
				const map = {};
				for (const p of posts) {
					if (!p.com) continue;
					const ms = [...p.com.matchAll(/href="#p(\d+)"/g)];
					for (const m of ms) {
						const n = parseInt(m[1], 10);
						if (!map[n]) map[n] = [];
						map[n].push(p.no);
					}
				}
				return map;
			}
			// Build parent map: for each post, what post does it directly reply to?
			function buildParentMap(posts) {
				const parent = {};
				const postNos = new Set(posts.map(p => p.no));
				for (const p of posts) {
					if (!p.com) continue;
					const ms = [...p.com.matchAll(/href="#p(\d+)"/g)];
					// Find the most recent (largest) post no that this post quotes, that exists in thread
					let best = null;
					for (const m of ms) {
						const n = parseInt(m[1], 10);
						if (postNos.has(n) && n !== p.no) {
							if (!best || n > best) best = n;
						}
					}
					if (best !== null) parent[p.no] = best;
				}
				return parent;
			}
			// Build tree structure
			function buildTree(posts) {
				const op = posts[0];
				const rest = posts.slice(1);
				const parentMap = buildParentMap(rest);
				// children map
				const children = {};
				for (const p of rest) {
					const par = parentMap[p.no] || op.no;
					if (!children[par]) children[par] = [];
					children[par].push(p.no);
				}
				return {
					op,
					children,
					parentMap,
					postMap: Object.fromEntries(posts.map(p => [p.no, p]))
				};
			}

			function renderThread() {
				const mo = document.getElementById('media-only-btn').classList.contains('is-on');
				state.treeMode = getPref('treeMode', true) && document.getElementById('tree-mode-btn').classList.contains('is-on');
				let posts = state.posts;
				if (mo) posts = posts.filter(p => !!p.tim);
				const container = document.getElementById('thread-posts');
				if (state.treeMode) {
					const {
						op,
						children,
						postMap
					} = buildTree(posts);
					let html = renderOpPost(op);
					html += renderChildPosts(op.no, children, postMap, 0);
					container.innerHTML = html;
				} else {
					container.innerHTML = posts.map(p => {
						if (state.hiddenPosts.has(p.no)) return renderHiddenStub(p.no);
						return p.resto === 0 ? renderOpPostHtml(p) : renderReplyFlat(p);
					}).join('');
				}
			}

			function renderChildPosts(parentNo, children, postMap, depth) {
				const kids = children[parentNo];
				if (!kids || !kids.length) return '';
				let html = `<div class="reply-tree">`;
				for (const no of kids) {
					const p = postMap[no];
					if (!p) continue;
					if (state.hiddenPosts.has(no)) {
						html += `<div class="post-reply-wrap">${renderHiddenStub(no)}</div>`;
						continue;
					}
					html += `<div class="post-reply-wrap" id="pw-${no}">`;
					html += renderBubblePost(p);
					html += `</div>`;
					html += renderChildPosts(no, children, postMap, depth + 1);
				}
				html += `</div>`;
				return html;
			}

			function renderOpPost(post) {
				return `<div id="p${post.no}">${renderOpPostHtml(post)}</div>`;
			}

			function renderOpPostHtml(post) {
				if (state.hiddenPosts.has(post.no)) return renderHiddenStub(post.no);
				const subHtml = post.sub ? `<div class="post-subject">${esc(post.sub)}</div>` : '';
				const idHtml = post.id ? `<span class="post-id ${getIdClass(post.id)}">${post.id}</span>` : '';
				const repliers = state.replyMap[post.no] || [];
				const replyLinksHtml = repliers.length ? `<div class="post-reply-links">${repliers.map(n=>`<span class="reply-link-item" onclick="jumpToPost(${n})" onmouseenter="showHoverPreview(event,${n})" onmouseleave="hideHoverPreview()">&gt;&gt;${n}</span>`).join('')}</div>` : '';
				let mediaHtml = '';
				if (post.tim) {
					const furl = Url.image(state.board, post.tim, post.ext);
					if (post.ext === '.webm' || post.ext === '.mp4') {
						mediaHtml = `<div class="post-video"><video controls preload="metadata"><source src="${furl}" type="video/${post.ext.slice(1)}"></video></div>`;
					} else {
						mediaHtml = `<div class="post-image"><img src="${furl}" alt="${esc(post.filename||'')}" title="${esc(post.filename||'')}${esc(post.ext||'')} (${post.w||'?'}×${post.h||'?'})" onclick="openLightbox('${furl}','${esc(post.ext||'')}','${esc(post.filename||'')}','${post.w||''}','${post.h||''}')" onerror="this.style.opacity=0.3"></div>`;
					}
				}
				const commentHtml = post.com ? `<div class="post-comment">${processComment(post.com)}</div>` : '';
				const replyCount = repliers.length;
				return `<div class="post-op-wrap" id="p${post.no}" oncontextmenu="showPostCtx(event,${post.no})">
    <div class="post-op-accent"></div>
    <div class="post-meta">
      <span class="post-no" onmouseenter="showReplyPopover(event,${post.no})" onmouseleave="hideReplyPopover()">No.${post.no}</span>
      ${idHtml}
      <span class="post-time">${post.now||''}</span>
      ${replyCount?`<span class="reply-count-badge">${replyCount} ${replyCount===1?'reply':'replies'}</span>`:''}
      <div class="post-actions-inline">
        <button class="btn btn-ghost btn-xs" onclick="hidePost(${post.no})">hide</button>
      </div>
    </div>
    ${subHtml}
    <div class="post-body">${mediaHtml}${commentHtml}</div>
    ${replyLinksHtml}
  </div>`;
			}

			function renderBubblePost(post) {
				const idHtml = post.id ? `<span class="post-id ${getIdClass(post.id)}">${post.id}</span>` : '';
				const repliers = state.replyMap[post.no] || [];
				const replyLinksHtml = repliers.length ? `<div class="post-reply-links">${repliers.map(n=>`<span class="reply-link-item" onclick="jumpToPost(${n})" onmouseenter="showHoverPreview(event,${n})" onmouseleave="hideHoverPreview()">&gt;&gt;${n}</span>`).join('')}</div>` : '';
				let mediaHtml = '';
				if (post.tim) {
					const furl = Url.image(state.board, post.tim, post.ext);
					if (post.ext === '.webm' || post.ext === '.mp4') {
						mediaHtml = `<div class="post-video"><video controls preload="metadata"><source src="${furl}" type="video/${post.ext.slice(1)}"></video></div>`;
					} else {
						mediaHtml = `<div class="post-image"><img src="${furl}" alt="${esc(post.filename||'')}" onclick="openLightbox('${furl}','${esc(post.ext||'')}','${esc(post.filename||'')}','${post.w||''}','${post.h||''}')" onerror="this.style.opacity=0.3"><br></div>`;
					}
				}
				const commentHtml = post.com ? `<div class="post-comment">${processComment(post.com)}</div>` : '';
				const replyCount = repliers.length;
				return `<div class="post-bubble" id="p${post.no}" oncontextmenu="showPostCtx(event,${post.no})">
    <div class="post-meta">
      <span class="post-no" onmouseenter="showReplyPopover(event,${post.no})" onmouseleave="hideReplyPopover()">No.${post.no}</span>
      ${idHtml}
      <span class="post-time">${post.now||''}</span>
      ${replyCount?`<span class="reply-count-badge">${replyCount}</span>`:''}
      <div class="post-actions-inline">
        <button class="btn btn-ghost btn-xs" onclick="hidePost(${post.no})">hide</button>
      </div>
    </div>
    <div class="post-body">${mediaHtml}${commentHtml}</div>
    ${replyLinksHtml}
  </div>`;
			}

			function renderReplyFlat(post) {
				return `<div style="margin-bottom:3px">${renderBubblePost(post)}</div>`;
			}

			function renderHiddenStub(no) {
				return `<div class="post-hidden-stub" id="ph-${no}" onclick="unhidePost(${no})">▶ post #${no} hidden — click to show</div>`;
			}

			function hidePost(no) {
				state.hiddenPosts.add(no);
				const el = document.getElementById(`p${no}`);
				if (el) {
					el.outerHTML = renderHiddenStub(no);
				}
			}

			function unhidePost(no) {
				state.hiddenPosts.delete(no);
				const post = state.posts.find(p => p.no === no);
				if (!post) return;
				const el = document.getElementById(`ph-${no}`) || document.getElementById(`p${no}`);
				if (el) {
					const isOp = post.resto === 0;
					el.outerHTML = isOp ? renderOpPostHtml(post) : renderBubblePost(post);
				}
			}

			function toggleTreeMode() {
				const btn = document.getElementById('tree-mode-btn');
				btn.classList.toggle('is-on');
				state.treeMode = btn.classList.contains('is-on');
				savePref('treeMode', state.treeMode);
				if (state.posts.length) renderThread();
			}

			function toggleMediaOnly() {
				const btn = document.getElementById('media-only-btn');
				btn.classList.toggle('is-on');
				if (state.posts.length) renderThread();
			}

			function getIdClass(id) {
				const h = [...id].reduce((a, c) => a + c.charCodeAt(0), 0);
				return ['id-red', 'id-green', 'id-blue', 'id-purple', 'id-default'][h % 5];
			}

			function processComment(com) {
				return com.replace(/<a href="(#p(\d+))"[^>]*class="quotelink"[^>]*>(&gt;&gt;\d+)<\/a>/g,
					(_, href, no, text) => `<a class="quotelink" data-no="${no}" href="${href}" onmouseenter="showHoverPreview(event,${no})" onmouseleave="hideHoverPreview()" onclick="jumpToPost(${no});return false;">${text}</a>`);
			}

			function jumpToPost(no) {
				const el = document.getElementById(`p${no}`);
				if (!el) return;
				el.scrollIntoView({
					block: 'center',
					behavior: 'smooth'
				});
				el.classList.add('is-highlighted');
				setTimeout(() => el.classList.remove('is-highlighted'), 1600);
			}
			// --- HOVER PREVIEW ---------------------------------------------------
			let hoverTimer = null,
				hideTimer = null;

			function showHoverPreview(event, no) {
				clearTimeout(hideTimer);
				clearTimeout(hoverTimer);
				hoverTimer = setTimeout(() => _showPreview(event, no), 220);
			}

			function _showPreview(event, no) {
				const post = state.posts.find(p => p.no === no);
				const el = document.getElementById('hover-preview');
				const inner = document.getElementById('preview-card-inner');
				if (!post) {
					inner.innerHTML = `<div class="preview-header"><span>No.${no}</span></div><div class="preview-notfound">post not in this thread</div>`;
				} else {
					const imgHtml = post.tim && post.ext !== '.webm' && post.ext !== '.mp4' ? `<div class="preview-img"><img src="${Url.image(state.board,post.tim,post.ext)}" onerror="this.parentElement.style.display='none'"></div>` : '';
					const com = post.com ? processComment(post.com) : '<em style="color:var(--fg4)">no comment</em>';
					inner.innerHTML = `<div class="preview-header"><span style="color:var(--acc3)">No.${post.no}</span><span>${post.now||''}</span></div>${imgHtml}<div class="preview-body">${com}</div>`;
				}
				el.style.display = 'block';
				positionPreview(event, el);
				requestAnimationFrame(() => el.classList.add('visible'));
			}

			function positionPreview(event, el) {
				el.style.left = '-9999px';
				el.style.top = '-9999px';
				el.style.display = 'block';
				const ew = el.offsetWidth || 340,
					eh = el.offsetHeight || 200;
				const vw = window.innerWidth,
					vh = window.innerHeight;
				const x = event.clientX + 16,
					y = event.clientY + 10;
				el.style.left = `${x+ew>vw-10?event.clientX-ew-12:x}px`;
				el.style.top = `${y+eh>vh-10?event.clientY-eh-12:y}px`;
			}

			function hideHoverPreview() {
				clearTimeout(hoverTimer);
				hideTimer = setTimeout(() => {
					const el = document.getElementById('hover-preview');
					el.classList.remove('visible');
					setTimeout(() => {
						if (!el.classList.contains('visible')) el.style.display = 'none'
					}, 160);
				}, 120);
			}
			// --- REPLY POPOVER ---------------------------------------------------
			let rpTimer = null,
				rpHide = null;

			function showReplyPopover(event, no) {
				clearTimeout(rpHide);
				clearTimeout(rpTimer);
				const repliers = state.replyMap[no];
				if (!repliers || !repliers.length) return;
				rpTimer = setTimeout(() => {
					const pop = document.getElementById('reply-popover');
					pop.innerHTML = `<div class="rp-title">replies to #${no}</div>${repliers.map(n=>`<span class="rp-link" onclick="jumpToPost(${n})">&gt;&gt;${n}</span>`).join(' ')}`;
					pop.style.display = 'block';
					const rect = event.currentTarget.getBoundingClientRect();
					let x = rect.left,
						y = rect.bottom + 4;
					pop.style.left = '-9999px';
					pop.style.top = '-9999px';
					setTimeout(() => {
						const pw = pop.offsetWidth;
						if (x + pw > window.innerWidth - 8) x = window.innerWidth - pw - 8;
						pop.style.left = `${x}px`;
						pop.style.top = `${y}px`;
					}, 0);
				}, 160);
			}

			function hideReplyPopover() {
				clearTimeout(rpTimer);
				rpHide = setTimeout(() => {
					document.getElementById('reply-popover').style.display = 'none'
				}, 180);
			}
			// --- CONTEXT MENUS ---------------------------------------------------
			function showCardCtx(event, threadNo, subject) {
				event.preventDefault();
				event.stopPropagation();
				showCtxMenu(event, [{
					type: 'header',
					label: subject ? subject.slice(0, 28) + '…' : `thread #${threadNo}`
				}, {
					type: 'group',
					items: [{
						icon: '→',
						label: 'open thread',
						shortcut: '↵',
						action: () => goThread(threadNo)
					}, {
						icon: '↗',
						label: 'open on 4chan',
						action: () => window.open(`https://boards.4chan.org/${state.board}/thread/${threadNo}`, '_blank')
					}, ]
				}, {
					type: 'group',
					items: [{
						icon: '⧉',
						label: 'copy link',
						action: () => navigator.clipboard.writeText(`https://boards.4chan.org/${state.board}/thread/${threadNo}`)
					}, ]
				}]);
			}

			function showPostCtx(event, postNo) {
				event.preventDefault();
				event.stopPropagation();
				const repliers = state.replyMap[postNo] || [];
				showCtxMenu(event, [{
					type: 'header',
					label: `post No.${postNo}`
				}, {
					type: 'group',
					items: [{
						icon: '⧉',
						label: 'copy post link',
						action: () => navigator.clipboard.writeText(`https://boards.4chan.org/${state.board}/thread/${state.threadNo}#p${postNo}`)
					}, {
						icon: '↗',
						label: 'open post on 4chan',
						action: () => window.open(`https://boards.4chan.org/${state.board}/thread/${state.threadNo}#p${postNo}`, '_blank')
					}, ]
				}, {
					type: 'group',
					items: [{
						icon: '◌',
						label: `hide post`,
						action: () => hidePost(postNo)
					}, ...(repliers.length ? [{
						icon: '↩',
						label: `${repliers.length} ${repliers.length===1?'reply':'replies'}`,
						action: () => {
							if (repliers.length) jumpToPost(repliers[0])
						}
					}] : []), ]
				}]);
			}

			function showCtxMenu(event, schema) {
				const menu = document.getElementById('ctx-menu');
				let html = '';
				for (const section of schema) {
					if (section.type === 'header') {
						html += `<div class="ctx-header">${esc(section.label)}</div>`;
					} else if (section.type === 'group') {
						html += `<div class="ctx-group">`;
						for (const item of section.items) {
							const id = `ctx-${Math.random().toString(36).slice(2)}`;
							html += `<div class="ctx-item" id="${id}"><span class="ctx-icon">${item.icon}</span><span class="ctx-label">${item.label}</span>${item.shortcut?`<span class="ctx-shortcut">${item.shortcut}</span>`:''}</div>`;
						}
						html += `</div>`;
					}
				}
				menu.innerHTML = html;
				// Attach actions after render
				let i = 0;
				for (const section of schema) {
					if (section.type === 'group') {
						for (const item of section.items) {
							const els = menu.querySelectorAll('.ctx-item');
							if (els[i]) els[i].addEventListener('click', () => {
								item.action && item.action();
								closeCtx()
							});
							i++;
						}
					}
				}
				menu.style.display = 'block';
				const x = Math.min(event.clientX, window.innerWidth - 220);
				const y = Math.min(event.clientY, window.innerHeight - 240);
				menu.style.left = `${x}px`;
				menu.style.top = `${y}px`;
			}

			function closeCtx() {
				document.getElementById('ctx-menu').style.display = 'none'
			}
			document.addEventListener('click', closeCtx);
			document.addEventListener('keydown', e => {
				if (e.key === 'Escape') {
					closeLightbox();
					closeThemeModal();
					closeFilters();
					closeCtx()
				}
			});
			// --- LIGHTBOX ---------------------------------------------------------─
			function openLightbox(url, ext, fname, w, h) {
				const lb = document.getElementById('lightbox');
				const content = document.getElementById('lightbox-content');
				const info = document.getElementById('lightbox-info');
				content.innerHTML = '';
				if (ext === '.webm' || ext === '.mp4') {
					const v = document.createElement('video');
					v.controls = true;
					v.autoplay = true;
					v.innerHTML = `<source src="${url}">`;
					content.appendChild(v);
				} else {
					const img = document.createElement('img');
					img.src = url;
					content.appendChild(img);
				}
				info.textContent = fname ? `${fname}${ext} — ${w}×${h}` : '';
				lb.classList.add('open');
			}

			function closeLightbox() {
				document.getElementById('lightbox').classList.remove('open');
				document.getElementById('lightbox-content').innerHTML = '';
			}
			// --- THEME MODAL ------------------------------------------------------
			function buildThemeGrid() {
				const current = getPref('theme', 'gruvbox-dark');
				document.getElementById('theme-grid').innerHTML = THEMES.map(t => {
					const bgStyle = t.pape ? `background-image:url('${t.pape}');background-size:cover;background-position:center;` : `background:${t.bars[0]};`;
					const bars = t.bars.slice(1).map(c => `<div style="background:${c}"></div>`).join('');
					return `<div class="theme-card ${t.id===current?'active':''}" onclick="applyTheme('${t.id}',this)">
      <div class="theme-preview"><div class="theme-preview-bg" style="${bgStyle}">${t.pape?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.45)"></div>`:''}</div><div class="theme-preview-bars">${bars}</div></div>
      <div class="theme-card-body"><div class="theme-card-name">${t.name}</div><div class="theme-card-desc">${t.desc}</div><div class="theme-card-fonts">${t.fonts}</div></div>
    </div>`;
				}).join('');
			}

			function applyTheme(id, cardEl) {
				document.body.setAttribute('data-theme', id);
				savePref('theme', id);
				document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
				if (cardEl) cardEl.classList.add('active');
			}

			function openThemeModal() {
				buildThemeGrid();
				document.getElementById('theme-modal').classList.add('open')
			}

			function closeThemeModal() {
				document.getElementById('theme-modal').classList.remove('open')
			}
			// --- FILTERS MODAL ---------------------------------------------------
			function openFilters() {
				document.getElementById('filters-modal').classList.add('open')
			}

			function closeFilters() {
				document.getElementById('filters-modal').classList.remove('open')
			}

			function resetFilters() {
				document.getElementById('f-nosub').checked = false;
				document.getElementById('f-noimg').checked = false;
				document.getElementById('f-block').value = '';
				if (state.view === 'catalog') renderCatalogFiltered();
			}
			// --- WALLPAPER & SETTINGS ---------------------------------------─
			function applyCustomPape(url) {
				if (url) {
					document.body.style.setProperty('--pape', `url('${url}')`);
					document.body.style.setProperty('--pape-overlay', 'rgba(0,0,0,0.5)');
				} else {
					document.body.style.removeProperty('--pape');
					document.body.style.removeProperty('--pape-overlay');
				}
				savePref('customPape', url);
			}

			function applyPapeBlur(v) {
				document.getElementById('pape-blur-val').textContent = `${v}px`;
				document.getElementById('pape-style-el').textContent = `body::before{filter:blur(${v}px);transform:scale(1.06)}`;
				savePref('papeBlur', v);
			}

			function applyPapeOpacity(v) {
				document.getElementById('pape-opacity-val').textContent = `${v}%`;
				document.body.style.setProperty('--pape-overlay', `rgba(0,0,0,${v/100})`);
				savePref('papeOpacity', v);
			}

			function toggleSidebar() {
				const sb = document.getElementById('sidebar');
				sb.classList.toggle('collapsed');
				savePref('showSidebar', !sb.classList.contains('collapsed'));
			}
			// --- SCROLL / BACK TO TOP ---------------------------------------─
			function scrollToTop() {
				document.getElementById('main').scrollTo({
					top: 0,
					behavior: 'smooth'
				})
			}
			document.getElementById('main').addEventListener('scroll', function() {
				document.getElementById('back-to-top').classList.toggle('visible', this.scrollTop > 400);
			});
			// --- STATUS BAR ------------------------------------------------------─
			function updateStatus(msg) {
				document.getElementById('status-time').textContent = new Date().toLocaleTimeString();
				document.getElementById('status-extra').textContent = msg || '';
			}
			// --- UTILS ---─
			function stripHtml(html) {
				return html.replace(/<[^>]+>/g, ' ').replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim()
			}

			function esc(s) {
				return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;')
			}
			// --- BOOT ------
			function boot() {
				state.prefs = loadPrefs();
				document.body.setAttribute('data-theme', getPref('theme', 'gruvbox-dark'));
				if (!getPref('showSidebar', true)) document.getElementById('sidebar').classList.add('collapsed');
				document.getElementById('toggle-large-grid').checked = getPref('largeCatalog', true);
				document.getElementById('sort-select').value = getPref('catalogSort', 'bump');
				const treePref = getPref('treeMode', true);
				document.getElementById('toggle-tree').checked = treePref;
				if (treePref) document.getElementById('tree-mode-btn').classList.add('is-on');
				const cp = getPref('customPape', '');
				if (cp) {
					document.getElementById('custom-pape-url').value = cp;
					applyCustomPape(cp)
				}
				const blur = getPref('papeBlur', 0);
				document.getElementById('pape-blur').value = blur;
				applyPapeBlur(blur);
				const op = getPref('papeOpacity', 0);
				document.getElementById('pape-opacity').value = op;
				updateStatus('starting…');
				goStart();
			}
			boot();

		</script>
	</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4chan Reader</title>
  <style>

    /* ─── Design tokens ──────────────────────────────────────────────────── */
    /*
     * Three greens from the spec, plus white for the page background.
     * --op-bg is the light cream for OP posts and board buttons.
     * --reply-bg is the muted sage for reply posts.
     * --accent is the stronger green used for borders and the header bar.
     */
    :root {
      --bg:        #ffffff;
      --op-bg:     #FCF9EA;
      --reply-bg:  #A8BBA3;
      --accent:    #97A87A;
      --text:      #1a1a1a;
      --muted:     #555555;
      --quote-green: #789922;
      --link-red:    #cc0000;

      --font-body: Georgia, 'Times New Roman', serif;
      --font-ui:   'Courier New', Courier, monospace;

      --max-width: 900px;
      --post-indent: 24px;   /* how far replies are pushed right vs OP */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
    }

    a {
      color: var(--link-red);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      cursor: pointer;
      font-family: inherit;
    }


    /* ─── Header / breadcrumb ────────────────────────────────────────────── */

    #header {
      background: var(--accent);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #header h1 {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    #breadcrumb {
      font-family: var(--font-ui);
      font-size: 12px;
      color: #ffffff;
    }

    #breadcrumb a {
      color: #ffffff;
      text-decoration: underline;
      cursor: pointer;
    }

    #breadcrumb a:hover {
      opacity: 0.8;
    }


    /* ─── Main content area ──────────────────────────────────────────────── */

    #main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 16px;
    }

    /* Thin rule with a label — used as section headings above catalog/thread */
    .section-label {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--accent);
      padding-bottom: 4px;
      margin-bottom: 14px;
    }


    /* ─── Status messages (loading / error) ──────────────────────────────── */

    .status-msg {
      padding: 24px 0;
      color: var(--muted);
      font-style: italic;
      font-family: var(--font-ui);
      font-size: 13px;
    }

    .status-msg.is-error {
      color: var(--link-red);
    }


    /* ─── Board list ─────────────────────────────────────────────────────── */

    .board-group {
      margin-bottom: 20px;
    }

    .board-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .board-btn {
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 80px;
    }

    .board-btn:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .board-btn .board-name {
      font-weight: bold;
    }

    .board-btn .board-title {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }

    .board-btn:hover .board-title {
      color: #ddd;
    }


    /* ─── Catalog grid ───────────────────────────────────────────────────── */

    #catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .catalog-card {
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 8px;
      cursor: pointer;
    }

    .catalog-card:hover {
      background: var(--reply-bg);
    }

    .catalog-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
      margin-bottom: 6px;
    }

    /* placeholder block when a thread has no image */
    .catalog-card .no-image {
      width: 100%;
      height: 110px;
      background: var(--reply-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .catalog-card .card-subject {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 3px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .catalog-card .card-comment {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .catalog-card .card-stats {
      font-family: var(--font-ui);
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
    }


    /* ─── Thread posts ───────────────────────────────────────────────────── */

    .post {
      padding: 8px 10px;
      border: 1px solid var(--accent);
      margin-bottom: 6px;
    }

    .post.is-op {
      background: var(--op-bg);
    }

    .post.is-reply {
      background: var(--reply-bg);
      margin-left: var(--post-indent);
    }

    /* Header row: subject · name · date · No.12345 */
    .post-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .post-subject {
      font-weight: bold;
      font-size: 14px;
      color: #2d5a1b;
    }

    .post-name {
      font-weight: bold;
      color: var(--text);
    }

    .post-id {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--muted);
    }

    /*
     * The "No.12345" clickable label. Hovering it triggers the reply popover
     * that lists every post which has >>12345 in its comment.
     */
    .post-no {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--muted);
      cursor: default;
      position: relative;
    }

    .post-no:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    /* A small "(3 replies)" indicator that lives beside the post number */
    .reply-count-badge {
      font-family: var(--font-ui);
      font-size: 10px;
      color: var(--accent);
    }

    /* Content row: optional thumbnail left, comment text right */
    .post-body {
      display: flex;
      gap: 10px;
    }

    .post-image a {
      display: block;
    }

    .post-image img {
      max-width: 140px;
      max-height: 140px;
      object-fit: contain;
      display: block;
      border: 1px solid var(--accent);
    }

    .post-comment {
      flex: 1;
      min-width: 0;
      word-break: break-word;
      line-height: 1.55;
      font-size: 14px;
    }

    /* 4chan's green-text span class */
    .post-comment .quote {
      color: var(--quote-green);
    }

    /* >>postno quotelinks inside post bodies */
    .post-comment a.quotelink {
      color: var(--link-red);
    }

    .post-comment a.quotelink:hover {
      text-decoration: underline;
    }


    /* ─── Reply popover ──────────────────────────────────────────────────── */
    /*
     * Appears below "No.12345" on hover. Lists every post number that has
     * quoted this post via >>#. Disappears when the mouse leaves the label.
     */

    #reply-popover {
      position: fixed;
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      font-family: var(--font-ui);
      font-size: 12px;
      z-index: 200;
      display: none;
      pointer-events: none;
      max-width: 260px;
      line-height: 1.8;
    }

    #reply-popover .popover-title {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    #reply-popover .popover-no {
      color: var(--link-red);
      margin-right: 4px;
    }

  </style>
</head>
<body>

  <div id="header">
    <h1>4chan</h1>
    <nav id="breadcrumb"></nav>
  </div>

  <div id="main">
    <div id="content"></div>
  </div>

  <!-- Floats near "No.12345" on hover, shows who quoted that post -->
  <div id="reply-popover"></div>

  <script>

    // ─────────────────────────────────────────────────────────────────────────
    // Config
    //
    // These are the only three URLs the whole app needs. The proxy is required
    // because 4cdn.org only allows CORS from 4chan.org/4channel.org itself, so
    // direct browser requests get blocked. codetabs forwards the request
    // server-side and hands back the JSON without CORS restrictions.
    // ─────────────────────────────────────────────────────────────────────────

    const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';
    const API   = 'https://a.4cdn.org';
    const CDN   = 'https://i.4cdn.org';


    // ─────────────────────────────────────────────────────────────────────────
    // View enum
    //
    // Object.freeze makes this behave like a true enum — the properties can't
    // be reassigned at runtime. JS has no native enum keyword.
    // ─────────────────────────────────────────────────────────────────────────

    const View = Object.freeze({
      BOARDS:  'boards',
      CATALOG: 'catalog',
      THREAD:  'thread',
    });


    // ─────────────────────────────────────────────────────────────────────────
    // App state
    //
    // Everything the reader needs to know about what it's currently showing.
    // Single object, mutated in place — keeps navigation simple.
    // ─────────────────────────────────────────────────────────────────────────

    const state = {
      view:     View.BOARDS,
      board:    null,       // string e.g. 'g', 'pol', 'a'
      threadNo: null,       // number — the OP post ID
      posts:    [],         // array of post objects in the current thread
      replyMap: {},         // { postNo: [postNos that quoted this post] }
    };


    // ─────────────────────────────────────────────────────────────────────────
    // URL builders
    //
    // One place for all string construction. Anything that calls the API or CDN
    // goes through here so typos only need fixing in one spot.
    // ─────────────────────────────────────────────────────────────────────────

    const Url = {
      boards:  ()                   => PROXY + encodeURIComponent(`${API}/boards.json`),
      catalog: (board)              => PROXY + encodeURIComponent(`${API}/${board}/catalog.json`),
      thread:  (board, no)          => PROXY + encodeURIComponent(`${API}/${board}/thread/${no}.json`),
      thumb:   (board, tim)         => `${CDN}/${board}/${tim}s.jpg`,
      image:   (board, tim, ext)    => `${CDN}/${board}/${tim}${ext}`,
    };


    // ─────────────────────────────────────────────────────────────────────────
    // apiFetch
    //
    // Wraps fetch with a status check. Throws on non-2xx so callers can use
    // a single try/catch instead of checking res.ok everywhere.
    // ─────────────────────────────────────────────────────────────────────────

    async function apiFetch(endpoint) {
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error(`HTTP ${res.status} from ${endpoint}`);
      return res.json();
    }


    // ─────────────────────────────────────────────────────────────────────────
    // buildReplyMap
    //
    // Scans all post comments for quotelinks (href="#p12345") and builds a
    // reverse index: for each post number X, store every post that quoted >>X.
    //
    // This is what powers the "who replied to this post" popover feature.
    // We build it once after loading a thread and keep it in state.replyMap.
    // ─────────────────────────────────────────────────────────────────────────

    function buildReplyMap(posts) {
      const map = {};

      for (const post of posts) {
        if (!post.com) continue;

        // 4chan encodes quotelinks as <a href="#p12345" class="quotelink">
        // so we match the href attribute pattern to find quoted post IDs.
        const matches = post.com.matchAll(/href="#p(\d+)"/g);

        for (const match of matches) {
          const quotedNo = parseInt(match[1], 10);
          if (!map[quotedNo]) map[quotedNo] = [];
          map[quotedNo].push(post.no);
        }
      }

      return map;
    }


    // ─────────────────────────────────────────────────────────────────────────
    // stripHtml
    //
    // Removes all tags from an HTML string and collapses whitespace. Used for
    // the catalog preview text — we show raw text, not rendered HTML there.
    // ─────────────────────────────────────────────────────────────────────────

    function stripHtml(html) {
      if (!html) return '';
      return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }


    // ─────────────────────────────────────────────────────────────────────────
    // DOM references — grab once, use everywhere
    // ─────────────────────────────────────────────────────────────────────────

    const contentEl    = document.getElementById('content');
    const breadcrumbEl = document.getElementById('breadcrumb');
    const popoverEl    = document.getElementById('reply-popover');


    // ─────────────────────────────────────────────────────────────────────────
    // Content helpers
    // ─────────────────────────────────────────────────────────────────────────

    function setContent(html) {
      contentEl.innerHTML = html;
    }

    function setLoading(message) {
      setContent(`<p class="status-msg">${message}</p>`);
    }

    function setError(message) {
      setContent(`<p class="status-msg is-error">Error: ${message}</p>`);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // updateBreadcrumb
    //
    // Rebuilds the "Home > /g/ > Thread #12345" nav in the header bar.
    // Each segment except the last is a clickable link.
    // ─────────────────────────────────────────────────────────────────────────

    function updateBreadcrumb() {
      const sep   = ' &rsaquo; ';
      const parts = [`<a onclick="goBoards()">Home</a>`];

      if (state.board) {
        parts.push(`<a onclick="goCatalog('${state.board}')">/${state.board}/</a>`);
      }

      if (state.threadNo) {
        parts.push(`Thread #${state.threadNo}`);
      }

      breadcrumbEl.innerHTML = parts.join(sep);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // goBoards — fetch boards.json and render the board picker
    // ─────────────────────────────────────────────────────────────────────────

    async function goBoards() {
      state.view     = View.BOARDS;
      state.board    = null;
      state.threadNo = null;
      updateBreadcrumb();
      setLoading('Loading board list...');

      try {
        const data = await apiFetch(Url.boards());
        renderBoards(data.boards);
      } catch (err) {
        setError(err.message);
      }
    }

    function renderBoards(boards) {
      // The API has a ws_board flag: 1 = worksafe, 0 = not worksafe.
      // Split into two groups so the layout is easier to navigate.
      const worksafe    = boards.filter(b => b.ws_board === 1);
      const notWorksafe = boards.filter(b => b.ws_board === 0);

      function renderGroup(list) {
        return list.map(b => `
          <button class="board-btn" onclick="goCatalog('${b.board}')">
            <span class="board-name">/${b.board}/</span>
            <span class="board-title">${b.title}</span>
          </button>
        `).join('');
      }

      setContent(`
        <div class="board-group">
          <p class="section-label">Worksafe boards (${worksafe.length})</p>
          <div class="board-grid">${renderGroup(worksafe)}</div>
        </div>
        <div class="board-group">
          <p class="section-label">Not worksafe boards (${notWorksafe.length})</p>
          <div class="board-grid">${renderGroup(notWorksafe)}</div>
        </div>
      `);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // goCatalog — fetch catalog.json and render the thread grid
    // ─────────────────────────────────────────────────────────────────────────

    async function goCatalog(board) {
      state.view     = View.CATALOG;
      state.board    = board;
      state.threadNo = null;
      updateBreadcrumb();
      setLoading(`Loading /${board}/...`);

      try {
        const pages = await apiFetch(Url.catalog(board));

        // catalog.json is an array of page objects, each with a threads array.
        // Flatten all pages into one list of thread objects.
        const threads = pages.flatMap(page => page.threads);

        renderCatalog(threads);
      } catch (err) {
        setError(err.message);
      }
    }

    function renderCatalog(threads) {
      const PREVIEW_CHARS = 120;   // how much of the comment text to show

      const cards = threads.map(t => {
        // tim is the Unix timestamp used as the image filename on the CDN.
        // If a thread has no image, tim is absent.
        const imageHtml = t.tim
          ? `<img src="${Url.thumb(state.board, t.tim)}" alt="" loading="lazy">`
          : `<div class="no-image">no image</div>`;

        const subjectHtml = t.sub
          ? `<div class="card-subject">${t.sub}</div>`
          : '';

        const preview = stripHtml(t.com).slice(0, PREVIEW_CHARS);

        return `
          <div class="catalog-card" onclick="goThread(${t.no})">
            ${imageHtml}
            ${subjectHtml}
            <div class="card-comment">${preview}</div>
            <div class="card-stats">${t.replies}R / ${t.images}I</div>
          </div>
        `;
      });

      setContent(`
        <p class="section-label">/${state.board}/ — ${threads.length} threads</p>
        <div id="catalog-grid">${cards.join('')}</div>
      `);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // goThread — fetch a thread JSON and render all posts
    // ─────────────────────────────────────────────────────────────────────────

    async function goThread(no) {
      state.view     = View.THREAD;
      state.threadNo = no;
      updateBreadcrumb();
      setLoading(`Loading thread #${no}...`);

      try {
        const data = await apiFetch(Url.thread(state.board, no));
        state.posts    = data.posts;
        state.replyMap = buildReplyMap(data.posts);
        renderThread(data.posts);
      } catch (err) {
        setError(err.message);
      }
    }

    function renderThread(posts) {
      const postsHtml = posts.map(renderPost).join('');

      setContent(`
        <p class="section-label">Thread #${state.threadNo} — ${posts.length} posts</p>
        ${postsHtml}
      `);

      // Wire up quotelinks so >>12345 scrolls to that post instead of
      // following the bare href anchor (which 4cdn.org would resolve to).
      attachQuotelinkHandlers();
    }

    function renderPost(post) {
      const isOp = post.resto === 0;

      // Subject only appears on OP posts (and rarely on replies, though
      // the API technically allows it — handle both just in case).
      const subjectHtml = post.sub
        ? `<span class="post-subject">${post.sub}</span>`
        : '';

      // ID field is only present on boards that show poster IDs (like /pol/).
      const idHtml = post.id
        ? `<span class="post-id">ID: ${post.id}</span>`
        : '';

      // Show how many replies this post has received, if any.
      // We read from replyMap which was built after loading the full thread.
      const repliers    = state.replyMap[post.no];
      const replyCount  = repliers ? repliers.length : 0;
      const replyBadge  = replyCount > 0
        ? `<span class="reply-count-badge">(${replyCount} repl${replyCount === 1 ? 'y' : 'ies'})</span>`
        : '';

      // Image thumbnail — clicking opens the full-size image in a new tab.
      const imageHtml = post.tim
        ? `<div class="post-image">
             <a href="${Url.image(state.board, post.tim, post.ext)}" target="_blank" rel="noopener">
               <img
                 src="${Url.thumb(state.board, post.tim)}"
                 alt="${post.filename || ''}"
                 title="${post.filename}${post.ext} (${post.w}x${post.h})"
               >
             </a>
           </div>`
        : '';

      const commentHtml = post.com
        ? `<div class="post-comment">${post.com}</div>`
        : '';

      return `
        <div class="post ${isOp ? 'is-op' : 'is-reply'}" id="p${post.no}">
          <div class="post-header">
            ${subjectHtml}
            <span class="post-name">${post.name || 'Anonymous'}</span>
            ${idHtml}
            <span class="post-time">${post.now}</span>
            <span
              class="post-no"
              onmouseenter="showPopover(event, ${post.no})"
              onmouseleave="hidePopover()"
            >No.${post.no}</span>
            ${replyBadge}
          </div>
          <div class="post-body">
            ${imageHtml}
            ${commentHtml}
          </div>
        </div>
      `;
    }

    // After the thread HTML is in the DOM, find every quotelink and attach
    // a click handler that scrolls the target post into view. We do this
    // instead of using bare href="#p12345" because 4cdn.org isn't our host.
    function attachQuotelinkHandlers() {
      contentEl.querySelectorAll('a.quotelink').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          const targetId = link.getAttribute('href');   // "#p12345"
          const target   = document.querySelector(targetId);
          if (target) target.scrollIntoView({ block: 'center' });
        });
      });
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Reply popover
    //
    // When you hover "No.12345", we look up state.replyMap[12345] and show a
    // small floating box listing every post that has quoted >>12345.
    //
    // The popover is position:fixed so it floats over the page without
    // affecting layout. We position it just below the hovered element.
    // ─────────────────────────────────────────────────────────────────────────

    function showPopover(event, postNo) {
      const repliers = state.replyMap[postNo];
      if (!repliers || repliers.length === 0) return;

      const noLinks = repliers
        .map(no => `<span class="popover-no">>>${no}</span>`)
        .join(' ');

      popoverEl.innerHTML = `
        <div class="popover-title">Replies to No.${postNo}</div>
        ${noLinks}
      `;

      popoverEl.style.display = 'block';

      // Position below the "No.XXXXX" element. Using getBoundingClientRect
      // gives us viewport-relative coords, which work directly with
      // position:fixed left/top.
      const GAP  = 4;   // px gap between element bottom and popover top
      const rect = event.currentTarget.getBoundingClientRect();

      let x = rect.left;
      let y = rect.bottom + GAP;

      // If the popover would go off the right edge of the viewport, nudge it left.
      // We read offsetWidth now because display:block makes it measurable.
      const overflowRight = x + popoverEl.offsetWidth - window.innerWidth;
      if (overflowRight > 0) x -= overflowRight + GAP;

      popoverEl.style.left = `${x}px`;
      popoverEl.style.top  = `${y}px`;
    }

    function hidePopover() {
      popoverEl.style.display = 'none';
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Boot — start on the board list every time the page loads
    // ─────────────────────────────────────────────────────────────────────────

    goBoards();

  </script>
</body>
</html>

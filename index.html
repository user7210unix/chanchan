/* ═══════════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--fg);
  background-color: var(--bg);
  min-height: 100vh;
  line-height: 1.6;
  transition: background-color 0.3s, color 0.3s;
  position: relative;
}

/* wallpaper layer */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: var(--pape);
  background-size: cover;
  background-position: center;
  z-index: 0;
  pointer-events: none;
  opacity: 1;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--pape-overlay);
  z-index: 0;
  pointer-events: none;
}

#app { position: relative; z-index: 1; }

a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--acc2); }

/* ═══════════════════════════════════════════════════════════
   GRADIENT BUTTONS — the star of the show
═══════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  position: relative;
  padding: 5px 12px;
  font-family: var(--font-ui);
  font-size: 11px;
  letter-spacing: 0.6px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  overflow: hidden;
  transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  user-select: none;
  outline: none;
  white-space: nowrap;
  text-transform: lowercase;
  background: linear-gradient(145deg, var(--btn-from), var(--btn-to));
  color: var(--btn-text);
  box-shadow: 0 1px 3px var(--shadow), inset 0 1px 0 var(--btn-shine);
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 60%);
  pointer-events: none;
}

.btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.1);
  box-shadow: 0 3px 8px var(--shadow), inset 0 1px 0 var(--btn-shine);
}
.btn:active {
  transform: translateY(0px) scale(0.98);
  filter: brightness(0.95);
  box-shadow: 0 1px 2px var(--shadow);
}

/* Ghost variant */
.btn-ghost {
  background: transparent;
  color: var(--fg3);
  box-shadow: none;
  border: 1px solid var(--border2);
}
.btn-ghost::before { display: none; }
.btn-ghost:hover {
  background: var(--bg3);
  color: var(--fg);
  border-color: var(--border3);
  box-shadow: none;
  filter: none;
}
.btn-ghost:active { transform: scale(0.98); box-shadow: none; filter: none; }
.btn-ghost.is-on { color: var(--acc3); border-color: var(--acc2); background: rgba(var(--acc2-rgb,180,120,20),0.1); }

/* Danger variant */
.btn-danger {
  --btn-from: #7a1010;
  --btn-to: #cc241d;
  --btn-text: #fff;
}

/* Small */
.btn-sm { padding: 3px 8px; font-size: 10px; }

/* ═══════════════════════════════════════════════════════════
   HEADER — fixed option
═══════════════════════════════════════════════════════════ */
#header {
  background: var(--bg1);
  border-bottom: 1px solid var(--border2);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  height: 42px;
  z-index: 100;
  flex-shrink: 0;
  backdrop-filter: blur(8px);
  transition: box-shadow 0.2s;
}

body.header-fixed #header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
}
body.header-fixed #app { padding-top: 42px; }

#header.scrolled { box-shadow: 0 2px 16px var(--shadow); }

.logo {
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 15px;
  color: var(--acc3);
  letter-spacing: 3px;
  flex-shrink: 0;
  padding-right: 12px;
  border-right: 1px solid var(--border);
}

#breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--fg4);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}
#breadcrumb .crumb { color: var(--fg3); cursor: pointer; transition: color 0.15s; }
#breadcrumb .crumb:hover { color: var(--acc3); }
#breadcrumb .sep { color: var(--bg4); }
#breadcrumb .crumb-current { color: var(--fg2); font-style: italic; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }

.header-right { display: flex; align-items: center; gap: 6px; }

/* ═══════════════════════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════════════════════ */
#app { display: flex; flex-direction: column; min-height: 100vh; }

.app-body {
  display: flex;
  flex: 1;
  overflow: hidden;
  height: calc(100vh - 42px);
}

/* ═══════════════════════════════════════════════════════════
   SIDEBAR
═══════════════════════════════════════════════════════════ */
#sidebar {
  width: 190px;
  flex-shrink: 0;
  background: var(--bg1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.2s ease;
}
#sidebar.collapsed { width: 0; overflow: hidden; }

.sidebar-search {
  padding: 8px;
  border-bottom: 1px solid var(--border);
}
.sidebar-search input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border2);
  color: var(--fg);
  padding: 5px 8px;
  font-family: var(--font-ui);
  font-size: 11px;
  border-radius: var(--radius);
  outline: none;
  transition: border-color 0.15s;
}
.sidebar-search input:focus { border-color: var(--acc2); }
.sidebar-search input::placeholder { color: var(--fg4); }

.sidebar-section-label {
  padding: 6px 10px 3px;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--fg4);
}

.board-list { overflow-y: auto; flex: 1; }

.board-item {
  padding: 5px 10px 5px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background 0.1s, border-color 0.1s;
  border-left: 2px solid transparent;
}
.board-item:hover { background: var(--bg2); border-left-color: var(--acc2); }
.board-item.active { background: var(--bg2); border-left-color: var(--acc3); color: var(--acc3); }
.board-item .bn { font-weight: 500; font-size: 12px; }
.board-item .bt { font-size: 10px; color: var(--fg4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
.board-item .nsfw { font-size: 9px; color: var(--red2); background: rgba(251,73,52,0.12); padding: 1px 4px; border-radius: 2px; }
.board-item.active .bt { color: var(--acc2); }

/* ═══════════════════════════════════════════════════════════
   MAIN PANEL
═══════════════════════════════════════════════════════════ */
#main {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}

/* ═══════════════════════════════════════════════════════════
   TOPBAR
═══════════════════════════════════════════════════════════ */
.topbar {
  background: var(--bg1);
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-info { font-size: 11px; color: var(--fg4); flex: 0 0 auto; }
.topbar-spacer { flex: 1; }
.topbar select {
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--fg2);
  padding: 4px 8px;
  font-family: var(--font-ui);
  font-size: 11px;
  border-radius: var(--radius);
  cursor: pointer;
  outline: none;
}
.topbar input[type=text] {
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--fg);
  padding: 4px 10px;
  font-family: var(--font-ui);
  font-size: 11px;
  border-radius: var(--radius);
  outline: none;
  width: 170px;
}
.topbar input[type=text]:focus { border-color: var(--acc2); }
.topbar input[type=text]::placeholder { color: var(--fg4); }

/* ═══════════════════════════════════════════════════════════
   STARTPAGE
═══════════════════════════════════════════════════════════ */
#view-start {
  padding: 28px 24px 24px;
  flex: 1;
}

.start-hero {
  margin-bottom: 28px;
}
.start-hero h1 {
  font-family: var(--font-accent);
  font-size: 38px;
  font-weight: 300;
  color: var(--fg);
  line-height: 1.1;
  letter-spacing: -0.5px;
}
.start-hero h1 em { font-style: italic; color: var(--acc3); }
.start-hero p {
  font-family: var(--font-body);
  font-size: 15px;
  color: var(--fg3);
  margin-top: 8px;
}

.start-stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  transition: border-color 0.15s, transform 0.15s;
}
.stat-card:hover { border-color: var(--border3); transform: translateY(-1px); }
.stat-card .sv {
  font-family: var(--font-accent);
  font-size: 28px;
  font-weight: 300;
  color: var(--acc3);
  line-height: 1;
  margin-bottom: 4px;
}
.stat-card .sl { font-size: 10px; color: var(--fg4); letter-spacing: 0.8px; text-transform: uppercase; }

.start-boards-section { margin-bottom: 28px; }
.section-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--fg4);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.boards-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.start-board-btn {
  background: var(--bg1);
  border: 1px solid var(--border);
  color: var(--fg3);
  padding: 5px 11px;
  font-family: var(--font-ui);
  font-size: 11px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  min-width: 52px;
}
.start-board-btn:hover { background: var(--bg3); border-color: var(--border3); color: var(--fg); }
.start-board-btn .sbn { font-weight: 500; color: var(--acc); font-size: 12px; }
.start-board-btn .sbt { font-size: 9px; color: var(--fg4); white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }

.start-chart {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  margin-bottom: 20px;
}
.start-chart h3 {
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--fg4);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.chart-bars { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
.chart-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
.chart-bar {
  width: 100%;
  background: linear-gradient(180deg, var(--acc3), var(--acc2));
  border-radius: 2px 2px 0 0;
  min-height: 2px;
  transition: height 0.5s cubic-bezier(.4,0,.2,1);
  position: relative;
  cursor: pointer;
}
.chart-bar:hover::after {
  content: attr(data-val);
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg4);
  color: var(--fg);
  padding: 2px 6px;
  font-size: 9px;
  border-radius: 2px;
  white-space: nowrap;
}
.chart-label { font-size: 8px; color: var(--fg4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; text-align: center; }

/* ═══════════════════════════════════════════════════════════
   CATALOG
═══════════════════════════════════════════════════════════ */
#view-catalog { padding: 12px; flex: 1; }

.catalog-grid-large {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 10px;
}
.catalog-grid-small {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}

.c-card {
  background: var(--bg1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, box-shadow 0.12s;
  position: relative;
  display: flex;
  flex-direction: column;
}
.c-card:hover {
  border-color: var(--border3);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px var(--shadow);
}

.c-card-img {
  width: 100%;
  aspect-ratio: 4/3;
  overflow: hidden;
  background: var(--bg2);
  position: relative;
  flex-shrink: 0;
}
.c-card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.2s ease;
}
.c-card:hover .c-card-img img { transform: scale(1.04); }
.c-card-img .no-img {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--fg4);
}

.c-card-overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.65));
  padding: 16px 8px 6px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.c-card-stat {
  font-family: var(--font-ui);
  font-size: 9px;
  color: rgba(255,255,255,0.85);
  background: rgba(0,0,0,0.35);
  padding: 2px 5px;
  border-radius: 2px;
  display: flex;
  gap: 8px;
}

.c-card-body { padding: 8px 9px 9px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.c-card-sub {
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: 11.5px;
  color: var(--acc3);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.c-card-preview {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--fg3);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  line-height: 1.45;
  flex: 1;
}
.c-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
}
.c-card-stats { font-size: 9px; color: var(--fg4); display: flex; gap: 8px; }
.c-card-stats .r { color: var(--green); }
.c-card-stats .i { color: var(--blue2); }

.c-card-badge {
  position: absolute;
  top: 6px; right: 6px;
  background: linear-gradient(135deg, var(--btn-from), var(--btn-to));
  color: var(--btn-text);
  font-size: 8px;
  padding: 2px 5px;
  border-radius: 2px;
  font-weight: 500;
  letter-spacing: 0.5px;
  box-shadow: 0 1px 4px var(--shadow);
}

/* ═══════════════════════════════════════════════════════════
   THREAD VIEW
═══════════════════════════════════════════════════════════ */
#view-thread { padding: 12px 16px; flex: 1; }

.t-post {
  margin-bottom: 10px;
}

.t-post-op {
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: var(--radius-md);
  padding: 11px 13px;
}

.t-post-reply {
  margin-left: 16px;
  padding: 7px 12px 7px 14px;
  border-left: 2px solid var(--border2);
  transition: border-color 0.12s;
  border-radius: 0 var(--radius) var(--radius) 0;
}
.t-post-reply:hover { border-left-color: var(--acc2); }
.t-post-reply.no-media { background: transparent; }

.post-header {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 5px;
  font-size: 11.5px;
}
.post-sub { font-family: var(--font-head); font-weight: 600; font-size: 17px; color: var(--green2); }
.post-name { display: none; }
.post-id {
  font-family: var(--font-ui);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 2px;
  cursor: default;
}
.post-time { font-size: 10px; color: var(--fg4); }
.post-no {
  font-family: var(--font-ui);
  font-size: 10.5px;
  color: var(--fg4);
  cursor: pointer;
  transition: color 0.12s;
}
.post-no:hover { color: var(--acc3); }
.reply-badge { font-size: 10px; color: var(--blue2); }
.post-actions { margin-left: auto; display: flex; gap: 3px; }

.post-body { display: flex; gap: 12px; align-items: flex-start; }

.post-image img {
  max-width: 380px;
  max-height: 380px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  cursor: zoom-in;
  border-radius: var(--radius);
  transition: opacity 0.15s;
}
.post-image img:hover { opacity: 0.9; }
.post-video video {
  max-width: 480px;
  max-height: 480px;
  width: 100%;
  border-radius: var(--radius);
}

.post-comment {
  flex: 1;
  min-width: 0;
  word-break: break-word;
  line-height: 1.6;
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--fg2);
}
.post-comment .quote { color: var(--quote); }
.post-comment .quotelink {
  color: var(--link);
  cursor: pointer;
  transition: opacity 0.1s;
  text-decoration: none;
}
.post-comment .quotelink:hover { opacity: 0.8; text-decoration: underline; }
.post-comment s { text-decoration: line-through; color: var(--fg4); }
.post-comment code {
  background: var(--bg3);
  padding: 1px 4px;
  border-radius: 2px;
  font-family: var(--font-ui);
  font-size: 12px;
}

/* highlighted post */
.is-highlighted {
  outline: 2px solid var(--acc);
  border-radius: var(--radius-md);
  animation: flashPost 1.4s ease-out forwards;
}
@keyframes flashPost {
  0%   { outline-color: var(--acc3); }
  100% { outline-color: transparent; }
}

/* hidden post stub */
.post-hidden-stub {
  margin-left: 16px;
  padding: 5px 12px;
  border-left: 2px dashed var(--border2);
  font-size: 11px;
  color: var(--fg4);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: 0 var(--radius) var(--radius) 0;
  transition: border-color 0.12s, color 0.12s;
}
.post-hidden-stub:hover { border-left-color: var(--acc2); color: var(--fg3); }

/* ═══════════════════════════════════════════════════════════
   HOVER PREVIEW POPOVER
═══════════════════════════════════════════════════════════ */
#hover-preview {
  position: fixed;
  z-index: 9000;
  pointer-events: none;
  display: none;
  transition: opacity 0.15s;
  opacity: 0;
}
#hover-preview.visible { display: block; opacity: 1; }
#hover-preview.fading { opacity: 0; }

.preview-card {
  background: var(--bg1);
  border: 1px solid var(--border3);
  border-radius: var(--radius-md);
  padding: 10px 12px;
  max-width: 360px;
  min-width: 220px;
  box-shadow: 0 8px 32px var(--shadow);
  font-size: 12px;
}
.preview-header {
  font-size: 10px;
  color: var(--fg4);
  margin-bottom: 6px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.preview-body { font-family: var(--font-body); font-size: 13px; color: var(--fg2); line-height: 1.55; }
.preview-body .quote { color: var(--quote); }
.preview-img {
  margin-bottom: 8px;
  max-height: 160px;
  overflow: hidden;
  border-radius: var(--radius);
}
.preview-img img { width: 100%; height: 160px; object-fit: cover; }
.preview-notfound { color: var(--fg4); font-style: italic; }

/* ═══════════════════════════════════════════════════════════
   REPLY POPOVER (hover on post number)
═══════════════════════════════════════════════════════════ */
#reply-popover {
  position: fixed;
  z-index: 8500;
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-md);
  padding: 6px 10px;
  font-size: 11px;
  color: var(--fg3);
  box-shadow: 0 4px 16px var(--shadow);
  pointer-events: auto;
}
#reply-popover .rp-title { font-size: 9px; color: var(--fg4); margin-bottom: 4px; letter-spacing: 0.5px; }
#reply-popover .rp-link {
  color: var(--link);
  cursor: pointer;
  margin-right: 6px;
  transition: color 0.1s;
}
#reply-popover .rp-link:hover { color: var(--acc3); text-decoration: underline; }

/* ═══════════════════════════════════════════════════════════
   CONTEXT MENU
═══════════════════════════════════════════════════════════ */
#ctx-menu {
  position: fixed;
  z-index: 9999;
  display: none;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-md);
  padding: 4px 0;
  box-shadow: 0 8px 24px var(--shadow);
  min-width: 160px;
  animation: ctxIn 0.1s ease;
}
@keyframes ctxIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

.ctx-item {
  padding: 7px 14px;
  font-size: 12px;
  color: var(--fg2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background 0.1s;
}
.ctx-item:hover { background: var(--bg3); color: var(--fg); }
.ctx-item.danger:hover { background: rgba(204,36,29,0.15); color: var(--red2); }
.ctx-sep { height: 1px; background: var(--border); margin: 3px 0; }
.ctx-icon { width: 14px; text-align: center; font-size: 11px; color: var(--fg4); }

/* ═══════════════════════════════════════════════════════════
   LIGHTBOX
═══════════════════════════════════════════════════════════ */
#lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  z-index: 9990;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img, #lightbox video {
  max-width: 95vw; max-height: 95vh;
  object-fit: contain;
  border-radius: var(--radius);
}
#lightbox-close {
  position: fixed;
  top: 14px; right: 20px;
  font-family: var(--font-ui);
  font-size: 20px;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  user-select: none;
  transition: color 0.12s;
}
#lightbox-close:hover { color: #fff; }
#lightbox-info {
  position: fixed;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}

/* ═══════════════════════════════════════════════════════════
   THEME MODAL
═══════════════════════════════════════════════════════════ */
#theme-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
#theme-modal.open { display: flex; }

.modal-panel {
  background: var(--bg1);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  width: 100%;
  max-width: 680px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

.modal-title {
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-close-btn {
  background: none; border: none; color: var(--fg4); cursor: pointer;
  font-size: 16px; padding: 2px 6px; border-radius: var(--radius);
  transition: color 0.12s;
}
.modal-close-btn:hover { color: var(--fg); }

.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.theme-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.12s, box-shadow 0.12s;
}
.theme-card:hover { border-color: var(--border3); transform: translateY(-2px); box-shadow: 0 4px 16px var(--shadow); }
.theme-card.active { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc2); }

.theme-preview {
  height: 70px;
  position: relative;
  overflow: hidden;
}
.theme-preview-bg { width: 100%; height: 100%; position: relative; }
.theme-pape { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
.theme-pape-overlay { position: absolute; inset: 0; }

.theme-preview-bars {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  height: 14px;
}
.theme-preview-bars div { flex: 1; }

.theme-card-body { padding: 6px 8px; background: var(--bg1); }
.theme-card-name { font-size: 11px; font-weight: 500; color: var(--fg2); margin-bottom: 1px; }
.theme-card-desc { font-size: 9px; color: var(--fg4); }
.theme-card-fonts { font-size: 8px; color: var(--fg4); margin-top: 2px; opacity: 0.7; }

.modal-section { margin-bottom: 20px; }
.modal-section-label {
  font-size: 10px;
  color: var(--fg4);
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.settings-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--fg3);
}
.settings-row label { min-width: 200px; }
.settings-row input[type=text] {
  flex: 1;
  background: var(--bg2);
  border: 1px solid var(--border2);
  color: var(--fg);
  padding: 5px 8px;
  font-family: var(--font-ui);
  font-size: 11px;
  border-radius: var(--radius);
  outline: none;
}
.settings-row input[type=text]:focus { border-color: var(--acc2); }

/* Toggle switch */
.toggle {
  position: relative;
  width: 34px;
  height: 18px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: var(--bg3);
  border-radius: 18px;
  transition: background 0.2s;
  cursor: pointer;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  left: 3px; top: 3px;
  width: 12px; height: 12px;
  background: var(--fg3);
  border-radius: 50%;
  transition: transform 0.2s, background 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--acc2); }
.toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--btn-text); }

/* Custom pape URL input */
.pape-url-row { flex-direction: column; align-items: flex-start; gap: 6px; }
.pape-url-row label { min-width: auto; }
.pape-url-row input { width: 100%; }

/* ═══════════════════════════════════════════════════════════
   SETTINGS MODAL (filters)
═══════════════════════════════════════════════════════════ */
#filters-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}
#filters-modal.open { display: flex; }

/* ═══════════════════════════════════════════════════════════
   STATUS BAR
═══════════════════════════════════════════════════════════ */
#statusbar {
  background: var(--bg1);
  border-top: 1px solid var(--border);
  padding: 4px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 10px;
  color: var(--fg4);
  flex-shrink: 0;
  letter-spacing: 0.3px;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; display: inline-block; margin-right: 4px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.status-sep { color: var(--bg4); }
#status-proxy { color: var(--blue2); cursor: pointer; }
#status-proxy:hover { color: var(--blue); }

/* ═══════════════════════════════════════════════════════════
   MISC
═══════════════════════════════════════════════════════════ */
.view { display: none; }
.view.active { display: flex; flex-direction: column; }

.empty-state {
  padding: 40px 20px;
  text-align: center;
  color: var(--fg4);
  font-family: var(--font-body);
  font-size: 15px;
  font-style: italic;
}

#back-to-top {
  position: fixed;
  bottom: 36px;
  right: 18px;
  z-index: 500;
  display: none;
}
#back-to-top.visible { display: block; }

/* Post ID colors */
.id-red { background: rgba(204,36,29,0.18); color: var(--red2); }
.id-green { background: rgba(152,151,26,0.18); color: var(--green2); }
.id-blue { background: rgba(69,133,136,0.18); color: var(--blue2); }
.id-purple { background: rgba(177,98,134,0.18); color: var(--purple); }
.id-default { background: var(--bg3); color: var(--fg3); }

/* Selection */
::selection { background: var(--acc2); color: var(--bg); }
</style>
</head>
<body data-theme="gruvbox-dark">

<div id="app">
  <!-- HEADER -->
  <div id="header">
    <div class="logo">CHAN</div>
    <nav id="breadcrumb">
      <span class="crumb" onclick="goStart()">home</span>
    </nav>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" onclick="openThemeModal()">◑ theme</button>
      <button class="btn btn-ghost btn-sm" onclick="openFilters()">⧉ filters</button>
      <button class="btn btn-ghost btn-sm" id="sidebar-toggle-btn" onclick="toggleSidebar()">☰</button>
    </div>
  </div>

  <div class="app-body">
    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebar-search">
        <input type="text" id="board-search" placeholder="search boards..." oninput="filterBoards(this.value)">
      </div>
      <div class="board-list" id="sidebar-board-list">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- MAIN -->
    <div id="main">

      <!-- STARTPAGE -->
      <div class="view active" id="view-start">
        <div style="padding: 28px 24px 24px; flex:1; overflow-y:auto;">
          <div class="start-hero">
            <h1>good<em>morning</em>,<br>anon.</h1>
            <p>a clean, fast 4chan reader. pick a board to begin.</p>
          </div>

          <div class="start-stats" id="start-stats">
            <div class="stat-card">
              <div class="sv" id="stat-boards">—</div>
              <div class="sl">boards</div>
            </div>
            <div class="stat-card">
              <div class="sv" id="stat-wsboards">—</div>
              <div class="sl">worksafe</div>
            </div>
            <div class="stat-card">
              <div class="sv" id="stat-nsboards">—</div>
              <div class="sl">not worksafe</div>
            </div>
            <div class="stat-card">
              <div class="sv" id="stat-threads">—</div>
              <div class="sl">live threads</div>
            </div>
          </div>

          <div class="start-chart" id="start-chart" style="display:none">
            <h3>top boards by threads</h3>
            <div class="chart-bars" id="chart-bars"></div>
          </div>

          <div class="start-boards-section" id="start-boards-section" style="display:none">
            <div class="section-label">worksafe</div>
            <div class="boards-grid" id="start-ws-boards"></div>
            <div class="section-label" style="margin-top:16px">not worksafe</div>
            <div class="boards-grid" id="start-nws-boards"></div>
          </div>
        </div>
      </div>

      <!-- CATALOG -->
      <div class="view" id="view-catalog">
        <div class="topbar">
          <span class="topbar-info" id="catalog-info">—</span>
          <select id="sort-select" onchange="onSortChange(this.value)">
            <option value="bump">bump order</option>
            <option value="replies">most replies</option>
            <option value="images">most images</option>
            <option value="newest">newest</option>
            <option value="oldest">oldest</option>
          </select>
          <input type="text" id="catalog-search" placeholder="search threads..." oninput="onSearchInput(this.value)">
          <div class="topbar-spacer"></div>
          <button class="btn btn-ghost btn-sm" id="grid-large-btn" onclick="setCatalogSize('large')" title="large grid">⬛</button>
          <button class="btn btn-ghost btn-sm" id="grid-small-btn" onclick="setCatalogSize('small')" title="small grid">⠿</button>
        </div>
        <div style="padding:12px; overflow-y:auto; flex:1;">
          <div id="catalog-grid" class="catalog-grid-large"></div>
        </div>
      </div>

      <!-- THREAD -->
      <div class="view" id="view-thread">
        <div class="topbar">
          <span class="topbar-info" id="thread-info">—</span>
          <div class="topbar-spacer"></div>
          <button class="btn btn-ghost btn-sm" id="media-only-btn" onclick="toggleMediaOnly()">⬡ media only</button>
          <button class="btn btn-ghost btn-sm" onclick="refreshThread()">⟳ refresh</button>
        </div>
        <div style="padding: 12px 16px; overflow-y:auto; flex:1;" id="thread-scroll">
          <div id="thread-posts"></div>
        </div>
      </div>

    </div><!-- /main -->
  </div><!-- /app-body -->

  <div id="statusbar">
    <span><span class="status-dot"></span>connected</span>
    <span class="status-sep">|</span>
    <span id="status-proxy" title="current proxy">codetabs.com</span>
    <span class="status-sep">|</span>
    <span id="status-time">—</span>
    <div style="flex:1"></div>
    <span id="status-extra"></span>
  </div>
</div>

<!-- HOVER PREVIEW -->
<div id="hover-preview"><div class="preview-card" id="preview-card-inner"></div></div>

<!-- REPLY POPOVER -->
<div id="reply-popover"></div>

<!-- CONTEXT MENU -->
<div id="ctx-menu"></div>

<!-- BACK TO TOP -->
<button class="btn btn-ghost btn-sm" id="back-to-top" onclick="scrollToTop()">↑ top</button>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
  <div id="lightbox-close" onclick="closeLightbox()">✕</div>
  <div id="lightbox-content"></div>
  <div id="lightbox-info"></div>
</div>

<!-- THEME MODAL -->
<div id="theme-modal" onclick="closeThemeModal()">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-title">
      <span>themes &amp; appearance</span>
      <button class="modal-close-btn" onclick="closeThemeModal()">✕</button>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">color themes</div>
      <div class="theme-grid" id="theme-grid"></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">wallpaper</div>
      <div class="settings-row pape-url-row">
        <label>custom wallpaper URL (for themed backgrounds)</label>
        <input type="text" id="custom-pape-url" placeholder="https://..." oninput="applyCustomPape(this.value)">
      </div>
      <div class="settings-row">
        <label>wallpaper blur</label>
        <input type="range" id="pape-blur" min="0" max="20" value="0" style="flex:1; accent-color: var(--acc);" oninput="applyPapeBlur(this.value)">
        <span id="pape-blur-val" style="min-width:28px; font-size:11px; color:var(--fg4)">0px</span>
      </div>
      <div class="settings-row">
        <label>overlay opacity</label>
        <input type="range" id="pape-opacity" min="0" max="95" value="0" style="flex:1; accent-color: var(--acc);" oninput="applyPapeOpacity(this.value)">
        <span id="pape-opacity-val" style="min-width:28px; font-size:11px; color:var(--fg4)">0%</span>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">layout &amp; behaviour</div>
      <div class="settings-row">
        <label>sticky header (fixed to top)</label>
        <label class="toggle"><input type="checkbox" id="toggle-fixed-header" onchange="toggleFixedHeader(this.checked)"><span class="toggle-slider"></span></label>
      </div>
      <div class="settings-row">
        <label>large catalog grid by default</label>
        <label class="toggle"><input type="checkbox" id="toggle-large-grid" onchange="savePref('largeCatalog', this.checked)"><span class="toggle-slider"></span></label>
      </div>
      <div class="settings-row">
        <label>show sidebar on start</label>
        <label class="toggle"><input type="checkbox" id="toggle-sidebar" checked onchange="savePref('showSidebar', this.checked)"><span class="toggle-slider"></span></label>
      </div>
    </div>
  </div>
</div>

<!-- FILTERS MODAL -->
<div id="filters-modal" onclick="closeFilters()">
  <div class="modal-panel" onclick="event.stopPropagation()" style="max-width:480px;">
    <div class="modal-title">
      <span>catalog filters</span>
      <button class="modal-close-btn" onclick="closeFilters()">✕</button>
    </div>
    <div class="settings-row">
      <label>hide threads without subject</label>
      <label class="toggle"><input type="checkbox" id="f-nosub" onchange="onFilterChange()"><span class="toggle-slider"></span></label>
    </div>
    <div class="settings-row">
      <label>hide threads without images</label>
      <label class="toggle"><input type="checkbox" id="f-noimg" onchange="onFilterChange()"><span class="toggle-slider"></span></label>
    </div>
    <div class="settings-row" style="align-items:flex-start; flex-direction:column; gap:6px;">
      <label>block words (comma separated)</label>
      <input type="text" id="f-block" placeholder="furry, crypto, nft" oninput="onFilterChange()" style="width:100%; background:var(--bg2); border:1px solid var(--border2); color:var(--fg); padding:6px 10px; font-family:var(--font-ui); font-size:11px; border-radius:var(--radius); outline:none;">
    </div>
    <div class="settings-row" style="margin-top:12px;">
      <label>thread view: media only mode</label>
      <label class="toggle"><input type="checkbox" id="f-mediaonly" onchange="savePref('mediaOnly', this.checked)"><span class="toggle-slider"></span></label>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
      <button class="btn btn-ghost btn-sm" onclick="resetFilters()">reset</button>
      <button class="btn btn-sm" onclick="closeFilters()">done</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────
const PROXY  = 'https://api.codetabs.com/v1/proxy?quest=';
const API    = 'https://a.4cdn.org';
const CDN    = 'https://i.4cdn.org';

const Url = {
  boards:  ()         => prx(`${API}/boards.json`),
  catalog: (b)        => prx(`${API}/${b}/catalog.json`),
  thread:  (b,n)      => prx(`${API}/${b}/thread/${n}.json`),
  thumb:   (b,tim)    => prx(`${CDN}/${b}/${tim}s.jpg`),
  image:   (b,tim,e)  => prx(`${CDN}/${b}/${tim}${e}`),
};
function prx(u) { return PROXY + encodeURIComponent(u); }

// ─────────────────────────────────────────────────────────────────
// THEME DEFINITIONS
// ─────────────────────────────────────────────────────────────────
const THEMES = [
  {
    id:'gruvbox-dark', name:'Gruvbox Dark', desc:'warm amber on brown',
    fonts:'DM Mono + Crimson Pro',
    bars:['#1d2021','#282828','#d79921','#98971a','#ebdbb2'],
    pape:null
  },
  {
    id:'gruvbox-light', name:'Gruvbox Light', desc:'amber on cream parchment',
    fonts:'DM Mono + Libre Baskerville',
    bars:['#f9f5d7','#fbf1c7','#b57614','#427b58','#3c3836'],
    pape:null
  },
  {
    id:'nord', name:'Nord', desc:'steel blues & arctic snow',
    fonts:'IBM Plex Mono + Space Grotesk',
    bars:['#1c2130','#2e3440','#88c0d0','#a3be8c','#eceff4'],
    pape:null
  },
  {
    id:'tokyo-night', name:'Tokyo Night', desc:'deep navy with neon accents',
    fonts:'JetBrains Mono + Space Grotesk',
    bars:['#0d0e1a','#1a1b2e','#7aa2f7','#bb9af7','#c0caf5'],
    pape:null
  },
  {
    id:'catppuccin', name:'Catppuccin Mocha', desc:'pastel purples on near-black',
    fonts:'JetBrains Mono + Space Grotesk',
    bars:['#11111b','#1e1e2e','#cba6f7','#a6e3a1','#cdd6f4'],
    pape:null
  },
  {
    id:'everforest', name:'Everforest', desc:'muted greens, forest calm',
    fonts:'DM Mono + Crimson Pro',
    bars:['#232a2e','#2d353b','#a7c080','#7fbbb3','#d3c6aa'],
    pape:null
  },
  {
    id:'nature', name:'Nature', desc:'ocean blues on cave dark',
    fonts:'IBM Plex Mono + Crimson Pro',
    bars:['#0a0e0b','#1f272d','#4a89ca','#6e9e6e','#cfe2f0'],
    pape:'https://images.unsplash.com/photo-1697186835760-4c40f9621c81?q=80&w=1074&auto=format&fit=crop'
  },
  {
    id:'neet', name:'NEET', desc:'anime waifu pape, soft purples',
    fonts:'DM Mono + Space Grotesk',
    bars:['#0f0e17','#231f3a','#e090e0','#80d0a0','#e8e4f4'],
    pape:'https://images.unsplash.com/photo-1578662996442-48f60103fc96?q=80&w=1200&auto=format&fit=crop'
  },
  {
    id:'monochrome', name:'Monochrome', desc:'pure black / white, sharp',
    fonts:'IBM Plex Mono × IBM Plex Mono',
    bars:['#000000','#111111','#ffffff','#888888','#f0f0f0'],
    pape:null
  },
  {
    id:'white', name:'Paper White', desc:'clean white, old web energy',
    fonts:'IBM Plex Mono + Libre Baskerville',
    bars:['#ffffff','#f8f8f8','#111111','#226622','#333333'],
    pape:null
  }
];

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
const state = {
  view: 'start',
  board: null,
  threadNo: null,
  posts: [],
  replyMap: {},
  boardList: [],
  catalogThreads: [],
  mediaOnly: false,
  hiddenPosts: new Set(),
  prefs: {},
  customPapeUrl: '',
};

// ─────────────────────────────────────────────────────────────────
// PREFS
// ─────────────────────────────────────────────────────────────────
const PREF_KEY = 'chanReader_prefs_v3';

function loadPrefs() {
  try {
    return JSON.parse(localStorage.getItem(PREF_KEY)) || {};
  } catch { return {}; }
}
function saveAllPrefs() {
  localStorage.setItem(PREF_KEY, JSON.stringify(state.prefs));
}
function savePref(k, v) {
  state.prefs[k] = v;
  saveAllPrefs();
}
function getPref(k, def) {
  return k in state.prefs ? state.prefs[k] : def;
}

// ─────────────────────────────────────────────────────────────────
// FETCH
// ─────────────────────────────────────────────────────────────────
async function apiFetch(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─────────────────────────────────────────────────────────────────
// VIEWS
// ─────────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(`view-${name}`);
  if (el) el.classList.add('active');
  state.view = name;
}

function setDocTitle(t) { document.title = t || 'CHAN — reader'; }

// ─────────────────────────────────────────────────────────────────
// BREADCRUMB
// ─────────────────────────────────────────────────────────────────
function updateBreadcrumb(parts) {
  const el = document.getElementById('breadcrumb');
  const html = parts.map((p, i) => {
    if (i < parts.length - 1) {
      return `<span class="crumb" onclick="${p.fn || ''}">${p.label}</span><span class="sep">›</span>`;
    }
    return `<span class="crumb-current">${p.label}</span>`;
  }).join('');
  el.innerHTML = html;
}

// ─────────────────────────────────────────────────────────────────
// STARTPAGE
// ─────────────────────────────────────────────────────────────────
async function goStart() {
  showView('start');
  setDocTitle('CHAN — reader');
  updateBreadcrumb([{ label: 'home' }]);
  document.getElementById('start-stats').style.display = '';
  document.getElementById('start-boards-section').style.display = 'none';
  document.getElementById('start-chart').style.display = 'none';
  updateStatus('loading boards...');

  try {
    const data = await apiFetch(Url.boards());
    state.boardList = data.boards;

    const ws  = data.boards.filter(b => b.ws_board === 1);
    const nws = data.boards.filter(b => b.ws_board === 0);

    document.getElementById('stat-boards').textContent  = data.boards.length;
    document.getElementById('stat-wsboards').textContent = ws.length;
    document.getElementById('stat-nsboards').textContent = nws.length;
    document.getElementById('stat-threads').textContent  = '—';

    // Build start board grids
    function makeBoardBtns(list) {
      return list.map(b => `
        <button class="start-board-btn" onclick="goCatalog('${b.board}')">
          <span class="sbn">/${b.board}/</span>
          <span class="sbt">${b.title}</span>
        </button>
      `).join('');
    }
    document.getElementById('start-ws-boards').innerHTML  = makeBoardBtns(ws);
    document.getElementById('start-nws-boards').innerHTML = makeBoardBtns(nws);
    document.getElementById('start-boards-section').style.display = '';

    // Build sidebar list
    buildSidebar(data.boards);

    // Chart: top 12 boards by threads (from catalog count simulation)
    buildStartChart(data.boards.slice(0, 16));

    updateStatus('ready');
  } catch(err) {
    updateStatus(`error: ${err.message}`);
  }
}

function buildStartChart(boards) {
  // We don't have live counts at this point; use page_count as proxy
  const data = boards.map(b => ({ name: `/${b.board}/`, val: b.per_page * b.pages || Math.floor(Math.random()*200+50) }));
  const max = Math.max(...data.map(d => d.val));

  const barsEl = document.getElementById('chart-bars');
  barsEl.innerHTML = data.map(d => `
    <div class="chart-bar-wrap">
      <div class="chart-bar" style="height:${Math.round((d.val/max)*72)}px" data-val="${d.val}" onclick="goCatalog('${d.name.replace(/\//g,'')}')"></div>
      <div class="chart-label">${d.name}</div>
    </div>
  `).join('');
  document.getElementById('start-chart').style.display = '';
}

function buildSidebar(boards) {
  const ws  = boards.filter(b => b.ws_board === 1);
  const nws = boards.filter(b => b.ws_board === 0);

  const sbl = document.getElementById('sidebar-board-list');
  sbl.innerHTML = `
    <div class="sidebar-section-label">worksafe</div>
    ${ws.map(b => sidebarItem(b)).join('')}
    <div class="sidebar-section-label" style="margin-top:8px">not worksafe</div>
    ${nws.map(b => sidebarItem(b)).join('')}
  `;
}

function sidebarItem(b) {
  return `
    <div class="board-item" id="sbi-${b.board}" onclick="goCatalog('${b.board}')">
      <div>
        <div class="bn">/${b.board}/</div>
        <div class="bt">${b.title}</div>
      </div>
    </div>
  `;
}

function filterBoards(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.board-item').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = q && !text.includes(q) ? 'none' : '';
  });
}

// ─────────────────────────────────────────────────────────────────
// CATALOG
// ─────────────────────────────────────────────────────────────────
let catalogRawThreads = [];

async function goCatalog(board) {
  state.board    = board;
  state.threadNo = null;
  state.view     = 'catalog';
  showView('catalog');
  setDocTitle(`/${board}/ — CHAN`);
  updateBreadcrumb([
    { label: 'home', fn: 'goStart()' },
    { label: `/${board}/` }
  ]);

  // Sidebar highlight
  document.querySelectorAll('.board-item').forEach(el => el.classList.remove('active'));
  const sbi = document.getElementById(`sbi-${board}`);
  if (sbi) sbi.classList.add('active');

  document.getElementById('catalog-info').textContent = `loading /${board}/...`;
  document.getElementById('catalog-grid').innerHTML = '<div class="empty-state">loading threads...</div>';
  updateStatus(`fetching /${board}/ catalog...`);

  try {
    const pages = await apiFetch(Url.catalog(board));
    catalogRawThreads = pages.flatMap(p => p.threads);
    renderCatalogFiltered();
    updateStatus(`/${board}/ — ${catalogRawThreads.length} threads`);
  } catch(err) {
    document.getElementById('catalog-grid').innerHTML = `<div class="empty-state">error: ${err.message}</div>`;
    updateStatus(`error: ${err.message}`);
  }
}

function renderCatalogFiltered() {
  let threads = [...catalogRawThreads];

  // Filter
  const noSub  = document.getElementById('f-nosub').checked;
  const noImg  = document.getElementById('f-noimg').checked;
  const block  = document.getElementById('f-block').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
  const search = document.getElementById('catalog-search').value.trim().toLowerCase();

  threads = threads.filter(t => {
    if (noSub && !t.sub) return false;
    if (noImg && !t.tim) return false;
    const text = `${t.sub||''} ${stripHtml(t.com||'')}`.toLowerCase();
    if (block.some(w => text.includes(w))) return false;
    if (search && !text.includes(search)) return false;
    return true;
  });

  // Sort
  const sort = document.getElementById('sort-select').value;
  if (sort === 'replies') threads.sort((a,b) => (b.replies||0)-(a.replies||0));
  else if (sort === 'images') threads.sort((a,b) => (b.images||0)-(a.images||0));
  else if (sort === 'newest') threads.sort((a,b) => b.no-a.no);
  else if (sort === 'oldest') threads.sort((a,b) => a.no-b.no);

  document.getElementById('catalog-info').textContent = `/${state.board}/ — ${threads.length} / ${catalogRawThreads.length} threads`;

  const isLarge = getPref('largeCatalog', true);
  const grid = document.getElementById('catalog-grid');
  grid.className = isLarge ? 'catalog-grid-large' : 'catalog-grid-small';
  grid.innerHTML = threads.map(t => renderCard(t)).join('');
}

function renderCard(t) {
  const imgHtml = t.tim
    ? `<img src="${Url.thumb(state.board, t.tim)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-img>no image</div>'">`
    : `<div class="no-img">no image</div>`;

  const preview = stripHtml(t.com||'').slice(0, 180);
  const sub = t.sub ? `<div class="c-card-sub">${t.sub}</div>` : '';

  return `
    <div class="c-card" onclick="goThread(${t.no})" oncontextmenu="showCardCtx(event,${t.no},'${(t.sub||'').replace(/'/g,"\\'")}')">
      <div class="c-card-img">
        ${imgHtml}
        <div class="c-card-overlay">
          <div class="c-card-stat">
            <span class="r">↑${t.replies||0}</span>
            <span class="i">⬡${t.images||0}</span>
          </div>
        </div>
      </div>
      <div class="c-card-body">
        ${sub}
        <div class="c-card-preview">${preview}</div>
      </div>
    </div>
  `;
}

function onSortChange(v) { savePref('catalogSort', v); renderCatalogFiltered(); }
function onSearchInput(v) { renderCatalogFiltered(); }
function onFilterChange() { renderCatalogFiltered(); }

function setCatalogSize(size) {
  const isLarge = size === 'large';
  savePref('largeCatalog', isLarge);
  renderCatalogFiltered();
}

// ─────────────────────────────────────────────────────────────────
// THREAD
// ─────────────────────────────────────────────────────────────────
async function goThread(no) {
  state.threadNo = no;
  showView('thread');
  updateBreadcrumb([
    { label: 'home', fn: 'goStart()' },
    { label: `/${state.board}/`, fn: `goCatalog('${state.board}')` },
    { label: `#${no}` }
  ]);

  document.getElementById('thread-info').textContent = `loading thread #${no}...`;
  document.getElementById('thread-posts').innerHTML = '<div class="empty-state">loading...</div>';
  updateStatus(`fetching thread #${no}...`);

  try {
    const data = await apiFetch(Url.thread(state.board, no));
    state.posts    = data.posts;
    state.replyMap = buildReplyMap(data.posts);
    state.hiddenPosts.clear();
    renderThread();

    const firstPost = data.posts[0];
    const sub = firstPost.sub || `thread #${no}`;
    setDocTitle(`/${state.board}/ — ${sub} — CHAN`);
    updateBreadcrumb([
      { label: 'home', fn: 'goStart()' },
      { label: `/${state.board}/`, fn: `goCatalog('${state.board}')` },
      { label: `/${state.board}/ — ${sub}` }
    ]);
    updateStatus(`${data.posts.length} posts`);
    document.getElementById('thread-info').textContent = `#${no} — ${data.posts.length} posts`;
  } catch(err) {
    document.getElementById('thread-posts').innerHTML = `<div class="empty-state">error: ${err.message}</div>`;
    updateStatus(`error: ${err.message}`);
  }
}

async function refreshThread() {
  if (state.threadNo) await goThread(state.threadNo);
}

function buildReplyMap(posts) {
  const map = {};
  for (const p of posts) {
    if (!p.com) continue;
    const ms = [...p.com.matchAll(/href="#p(\d+)"/g)];
    for (const m of ms) {
      const n = parseInt(m[1], 10);
      if (!map[n]) map[n] = [];
      map[n].push(p.no);
    }
  }
  return map;
}

function renderThread() {
  state.mediaOnly = document.getElementById('f-mediaonly').checked;
  const mo = document.getElementById('media-only-btn').classList.contains('is-on');

  let posts = state.posts;
  if (mo) posts = posts.filter(p => !!p.tim);

  document.getElementById('thread-posts').innerHTML = posts.map(p => renderPost(p)).join('');
  attachPostHandlers();
}

function renderPost(post) {
  if (state.hiddenPosts.has(post.no)) {
    return `
      <div class="post-hidden-stub" id="ph-${post.no}" onclick="unhidePost(${post.no})">
        <span style="color:var(--acc2)">▶</span>
        <span>post #${post.no} hidden — click to show</span>
      </div>
    `;
  }

  const isOp = post.resto === 0;
  const subHtml = post.sub ? `<span class="post-sub">${post.sub}</span>` : '';
  const idHtml = post.id ? `<span class="post-id ${getIdClass(post.id)}">${post.id}</span>` : '';
  const repliers   = state.replyMap[post.no] || [];
  const replyBadge = repliers.length > 0 ? `<span class="reply-badge">(${repliers.length})</span>` : '';

  let mediaHtml = '';
  if (post.tim) {
    const fileUrl = Url.image(state.board, post.tim, post.ext);
    if (post.ext === '.webm' || post.ext === '.mp4') {
      mediaHtml = `<div class="post-video"><video controls preload="metadata"><source src="${fileUrl}" type="video/${post.ext.slice(1)}"></video></div>`;
    } else {
      mediaHtml = `
        <div class="post-image">
          <img src="${fileUrl}" alt="${esc(post.filename||'')}"
            title="${esc(post.filename||'')}${esc(post.ext||'')} (${post.w||'?'}×${post.h||'?'})"
            onclick="openLightbox('${fileUrl}','${esc(post.ext||'')}','${esc(post.filename||'')}','${post.w||''}','${post.h||''}')"
            onerror="this.style.opacity=0.3"
          >
        </div>`;
    }
  }

  const commentHtml = post.com
    ? `<div class="post-comment">${processComment(post.com)}</div>`
    : '';

  const cls = isOp ? 't-post-op' : 't-post-reply';

  return `
    <div class="t-post" id="p${post.no}">
      <div class="${cls}">
        <div class="post-header">
          ${subHtml}
          <span class="post-name">${esc(post.name||'Anonymous')}</span>
          ${idHtml}
          <span class="post-time">${post.now||''}</span>
          <span class="post-no"
            onmouseenter="showReplyPopover(event,${post.no})"
            onmouseleave="hideReplyPopover()"
          >No.${post.no}</span>
          ${replyBadge}
          <div class="post-actions">
            <button class="btn btn-ghost btn-sm" onclick="hidePost(${post.no})">hide</button>
          </div>
        </div>
        <div class="post-body">
          ${mediaHtml}
          ${commentHtml}
        </div>
      </div>
    </div>
  `;
}

function getIdClass(id) {
  const h = [...id].reduce((a,c) => a + c.charCodeAt(0), 0);
  const classes = ['id-red','id-green','id-blue','id-purple','id-default'];
  return classes[h % classes.length];
}

function processComment(com) {
  // Add quotelink hover handlers
  return com.replace(
    /<a href="(#p(\d+))"[^>]*class="quotelink"[^>]*>(&gt;&gt;\d+)<\/a>/g,
    (_, href, no, text) =>
      `<a class="quotelink" data-no="${no}" href="${href}"
         onmouseenter="showHoverPreview(event,${no})"
         onmouseleave="hideHoverPreview()"
         onclick="jumpToPost(${no});return false;">${text}</a>`
  );
}

function attachPostHandlers() {
  // quotelinks already have inline handlers via processComment
}

function hidePost(no) {
  state.hiddenPosts.add(no);
  const el = document.getElementById(`p${no}`);
  if (el) el.outerHTML = `
    <div class="t-post" id="p${no}">
      <div class="post-hidden-stub" onclick="unhidePost(${no})">
        <span style="color:var(--acc2)">▶</span>
        <span>post #${no} hidden — click to show</span>
      </div>
    </div>
  `;
}

function unhidePost(no) {
  state.hiddenPosts.delete(no);
  const post = state.posts.find(p => p.no === no);
  if (post) {
    const el = document.getElementById(`p${no}`);
    if (el) el.outerHTML = renderPost(post);
  }
}

function toggleMediaOnly() {
  const btn = document.getElementById('media-only-btn');
  btn.classList.toggle('is-on');
  renderThread();
}

function jumpToPost(no) {
  const el = document.getElementById(`p${no}`);
  if (!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('is-highlighted');
  setTimeout(() => el.classList.remove('is-highlighted'), 1500);
}

// ─────────────────────────────────────────────────────────────────
// HOVER PREVIEW (>>quotelinks)
// ─────────────────────────────────────────────────────────────────
let hoverTimer = null;
let hideTimer  = null;

function showHoverPreview(event, no) {
  clearTimeout(hideTimer);
  clearTimeout(hoverTimer);
  hoverTimer = setTimeout(() => _showPreview(event, no), 250);
}

function _showPreview(event, no) {
  const post = state.posts.find(p => p.no === no);
  const el   = document.getElementById('hover-preview');
  const inner = document.getElementById('preview-card-inner');

  if (!post) {
    inner.innerHTML = `<div class="preview-header"><span>No.${no}</span></div><div class="preview-notfound">post not found in this thread</div>`;
  } else {
    const imgHtml = post.tim && (post.ext !== '.webm' && post.ext !== '.mp4')
      ? `<div class="preview-img"><img src="${Url.image(state.board, post.tim, post.ext)}" onerror="this.parentElement.style.display='none'"></div>`
      : '';
    const com = post.com ? processComment(post.com) : '<em style="color:var(--fg4)">no comment</em>';
    inner.innerHTML = `
      <div class="preview-header">
        <span>No.${post.no}</span>
        <span style="color:var(--fg4)">${post.now||''}</span>
      </div>
      ${imgHtml}
      <div class="preview-body">${com}</div>
    `;
  }

  el.style.display = 'block';
  positionPreview(event, el);
  requestAnimationFrame(() => el.classList.add('visible'));
}

function positionPreview(event, el) {
  el.style.left = '-9999px';
  el.style.top  = '-9999px';
  el.style.display = 'block';

  const ew = el.offsetWidth  || 360;
  const eh = el.offsetHeight || 200;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const x  = event.clientX + 14;
  const y  = event.clientY + 10;
  const finalX = x + ew > vw - 10 ? event.clientX - ew - 10 : x;
  const finalY = y + eh > vh - 10 ? event.clientY - eh - 10 : y;
  el.style.left = `${finalX}px`;
  el.style.top  = `${finalY}px`;
}

function hideHoverPreview() {
  clearTimeout(hoverTimer);
  hideTimer = setTimeout(() => {
    const el = document.getElementById('hover-preview');
    el.classList.remove('visible');
    setTimeout(() => { if (!el.classList.contains('visible')) el.style.display = 'none'; }, 160);
  }, 120);
}

// ─────────────────────────────────────────────────────────────────
// REPLY POPOVER (hover on post number)
// ─────────────────────────────────────────────────────────────────
let rpTimer = null;
let rpHide  = null;

function showReplyPopover(event, no) {
  clearTimeout(rpHide);
  clearTimeout(rpTimer);
  const repliers = state.replyMap[no];
  if (!repliers || !repliers.length) return;

  rpTimer = setTimeout(() => {
    const pop = document.getElementById('reply-popover');
    pop.innerHTML = `
      <div class="rp-title">replies to #${no}</div>
      ${repliers.map(n => `<span class="rp-link" onclick="jumpToPost(${n})">&gt;&gt;${n}</span>`).join(' ')}
    `;
    pop.style.display = 'block';

    const rect = event.currentTarget.getBoundingClientRect();
    let x = rect.left;
    let y = rect.bottom + 4;
    pop.style.left = '-9999px';
    pop.style.top  = '-9999px';
    setTimeout(() => {
      const pw = pop.offsetWidth;
      if (x + pw > window.innerWidth - 8) x = window.innerWidth - pw - 8;
      pop.style.left = `${x}px`;
      pop.style.top  = `${y}px`;
    }, 0);
  }, 180);
}

function hideReplyPopover() {
  clearTimeout(rpTimer);
  rpHide = setTimeout(() => {
    document.getElementById('reply-popover').style.display = 'none';
  }, 200);
}

// ─────────────────────────────────────────────────────────────────
// CONTEXT MENU
// ─────────────────────────────────────────────────────────────────
function showCardCtx(event, threadNo, subject) {
  event.preventDefault();
  event.stopPropagation();
  const menu = document.getElementById('ctx-menu');
  menu.innerHTML = `
    <div class="ctx-item" onclick="goThread(${threadNo}); closeCtx()">
      <span class="ctx-icon">→</span> open thread
    </div>
    <div class="ctx-item" onclick="window.open('https://boards.4chan.org/${state.board}/thread/${threadNo}','_blank'); closeCtx()">
      <span class="ctx-icon">↗</span> open on 4chan
    </div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="navigator.clipboard.writeText('https://boards.4chan.org/${state.board}/thread/${threadNo}'); closeCtx()">
      <span class="ctx-icon">⧉</span> copy link
    </div>
  `;
  menu.style.display = 'block';
  const x = Math.min(event.clientX, window.innerWidth  - 200);
  const y = Math.min(event.clientY, window.innerHeight - 200);
  menu.style.left = `${x}px`;
  menu.style.top  = `${y}px`;
}

function closeCtx() {
  document.getElementById('ctx-menu').style.display = 'none';
}

document.addEventListener('click', closeCtx);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeLightbox(); closeThemeModal(); closeFilters(); closeCtx(); }
});

// ─────────────────────────────────────────────────────────────────
// LIGHTBOX
// ─────────────────────────────────────────────────────────────────
function openLightbox(url, ext, fname, w, h) {
  const lb = document.getElementById('lightbox');
  const content = document.getElementById('lightbox-content');
  const info = document.getElementById('lightbox-info');
  content.innerHTML = '';
  if (ext === '.webm' || ext === '.mp4') {
    const v = document.createElement('video');
    v.controls = true; v.autoplay = true;
    v.innerHTML = `<source src="${url}">`;
    content.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = url;
    content.appendChild(img);
  }
  info.textContent = fname ? `${fname}${ext} — ${w}×${h}` : '';
  lb.classList.add('open');
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}

// ─────────────────────────────────────────────────────────────────
// THEME MODAL
// ─────────────────────────────────────────────────────────────────
function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  const current = getPref('theme', 'gruvbox-dark');
  grid.innerHTML = THEMES.map(t => {
    const papeStyle = t.pape
      ? `background-image:url('${t.pape}'); background-size:cover; background-position:center;`
      : `background:${t.bars[0]};`;
    const bars = t.bars.slice(1).map(c => `<div style="background:${c}"></div>`).join('');
    return `
      <div class="theme-card ${t.id === current ? 'active' : ''}" onclick="applyTheme('${t.id}', this)" id="tc-${t.id}">
        <div class="theme-preview">
          <div class="theme-preview-bg" style="${papeStyle}">
            ${t.pape ? `<div class="theme-pape-overlay" style="background:rgba(0,0,0,0.45)"></div>` : ''}
          </div>
          <div class="theme-preview-bars">${bars}</div>
        </div>
        <div class="theme-card-body">
          <div class="theme-card-name">${t.name}</div>
          <div class="theme-card-desc">${t.desc}</div>
          <div class="theme-card-fonts">${t.fonts}</div>
        </div>
      </div>
    `;
  }).join('');
}

function applyTheme(id, cardEl) {
  document.body.setAttribute('data-theme', id);
  savePref('theme', id);
  document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('active'));
  if (cardEl) cardEl.classList.add('active');
}

function openThemeModal() {
  buildThemeGrid();
  document.getElementById('theme-modal').classList.add('open');
}
function closeThemeModal() {
  document.getElementById('theme-modal').classList.remove('open');
}

// ─────────────────────────────────────────────────────────────────
// FILTERS MODAL
// ─────────────────────────────────────────────────────────────────
function openFilters() { document.getElementById('filters-modal').classList.add('open'); }
function closeFilters() { document.getElementById('filters-modal').classList.remove('open'); }
function resetFilters() {
  document.getElementById('f-nosub').checked = false;
  document.getElementById('f-noimg').checked = false;
  document.getElementById('f-block').value = '';
  if (state.view === 'catalog') renderCatalogFiltered();
}

// ─────────────────────────────────────────────────────────────────
// WALLPAPER & LAYOUT SETTINGS
// ─────────────────────────────────────────────────────────────────
function applyCustomPape(url) {
  if (url) {
    document.body.style.setProperty('--pape', `url('${url}')`);
    document.body.style.setProperty('--pape-overlay', 'rgba(0,0,0,0.5)');
  } else {
    document.body.style.removeProperty('--pape');
    document.body.style.removeProperty('--pape-overlay');
  }
  savePref('customPape', url);
}

function applyPapeBlur(v) {
  document.getElementById('pape-blur-val').textContent = `${v}px`;
  document.body.style.setProperty('--pape-blur', `${v}px`);
  // apply to before pseudo via wrapper approach
  document.getElementById('pape-style').textContent =
    `body::before { filter: blur(${v}px); transform: scale(1.05); }`;
  savePref('papeBlur', v);
}

function applyPapeOpacity(v) {
  document.getElementById('pape-opacity-val').textContent = `${v}%`;
  const alpha = v / 100;
  // We'll inject override style for overlay
  const theme = getPref('theme','gruvbox-dark');
  const themeData = THEMES.find(t => t.id === theme);
  if (themeData && themeData.pape) {
    document.body.style.setProperty('--pape-overlay', `rgba(0,0,0,${alpha})`);
  }
  savePref('papeOpacity', v);
}

function toggleFixedHeader(checked) {
  document.body.classList.toggle('header-fixed', checked);
  savePref('fixedHeader', checked);
}

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('collapsed');
  savePref('showSidebar', !sb.classList.contains('collapsed'));
}

// ─────────────────────────────────────────────────────────────────
// BACK TO TOP
// ─────────────────────────────────────────────────────────────────
function scrollToTop() {
  document.getElementById('main').scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('main').addEventListener('scroll', function() {
  const btt = document.getElementById('back-to-top');
  btt.classList.toggle('visible', this.scrollTop > 400);
  const header = document.getElementById('header');
  header.classList.toggle('scrolled', this.scrollTop > 10);
});

// ─────────────────────────────────────────────────────────────────
// STATUS BAR
// ─────────────────────────────────────────────────────────────────
function updateStatus(msg) {
  const now = new Date().toLocaleTimeString();
  document.getElementById('status-time').textContent = now;
  document.getElementById('status-extra').textContent = msg || '';
}

// ─────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────
function stripHtml(html) {
  return html.replace(/<[^>]+>/g,' ').replace(/&gt;/g,'>').replace(/&lt;/g,'<').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─────────────────────────────────────────────────────────────────
// PAPE STYLE INJECTION
// ─────────────────────────────────────────────────────────────────
const papeStyleEl = document.createElement('style');
papeStyleEl.id = 'pape-style';
document.head.appendChild(papeStyleEl);

// ─────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────
function boot() {
  state.prefs = loadPrefs();

  // Apply saved theme
  const theme = getPref('theme', 'gruvbox-dark');
  document.body.setAttribute('data-theme', theme);

  // Apply saved layout prefs
  if (getPref('fixedHeader', false)) {
    document.body.classList.add('header-fixed');
    document.getElementById('toggle-fixed-header').checked = true;
  }
  if (!getPref('showSidebar', true)) {
    document.getElementById('sidebar').classList.add('collapsed');
    document.getElementById('toggle-sidebar').checked = false;
  }
  document.getElementById('toggle-large-grid').checked = getPref('largeCatalog', true);
  document.getElementById('sort-select').value = getPref('catalogSort', 'bump');

  // Custom pape
  const cp = getPref('customPape', '');
  if (cp) { document.getElementById('custom-pape-url').value = cp; applyCustomPape(cp); }
  const blur = getPref('papeBlur', 0);
  document.getElementById('pape-blur').value = blur;
  applyPapeBlur(blur);
  const op = getPref('papeOpacity', 0);
  document.getElementById('pape-opacity').value = op;

  updateStatus('starting...');
  goStart();
}

boot();
</script>

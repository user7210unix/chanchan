<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reader</title>

  <style>
    :root {
      --bg:        #ffffff;
      --op-bg:     #FCF9EA;
      --reply-bg:  #A8BBA3;
      --accent:    #97A87A;
      --text:      #1a1a1a;
      --muted:     #555555;
      --quote-green: #789922;
      --link-red:    #cc0000;

      --font-body: Georgia, 'Times New Roman', serif;
      --font-ui:   'Courier New', Courier, monospace;

      --max-width: 900px;
      --post-indent: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.6;
    }

    a { color: var(--link-red); text-decoration: none; }
    a:hover { text-decoration: underline; }

    button {
      cursor: pointer;
      font-family: inherit;
    }

    /* ─── Header ─────────────────────────────────────────────────────── */

    #header {
      background: var(--accent);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #header h1 {
      font-family: var(--font-ui);
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    #breadcrumb {
      font-family: var(--font-ui);
      font-size: 12px;
      color: #ffffff;
      flex: 1;
    }

    #breadcrumb a {
      color: #ffffff;
      text-decoration: underline;
      cursor: pointer;
    }

    #breadcrumb a:hover { opacity: 0.85; }

    #header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      border: 1px solid rgba(255,255,255,0.65);
      background: rgba(255,255,255,0.15);
      color: white;
      padding: 4px 10px;
      font-family: var(--font-ui);
      font-size: 12px;
      border-radius: 4px;
    }

    .header-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ─── Main ───────────────────────────────────────────────────────── */

    #main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 16px;
    }

    .section-label {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--accent);
      padding-bottom: 4px;
      margin-bottom: 14px;
    }

    /* ─── Status ─────────────────────────────────────────────────────── */

    .status-msg {
      padding: 24px 0;
      color: var(--muted);
      font-style: italic;
      font-family: var(--font-ui);
      font-size: 13px;
    }

    .status-msg.is-error {
      color: var(--link-red);
    }

    /* ─── Boards ─────────────────────────────────────────────────────── */

    .board-group {
      margin-bottom: 20px;
    }

    .board-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .board-btn {
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 80px;
    }

    .board-btn:hover {
      background: var(--accent);
      color: #ffffff;
    }

    .board-btn .board-name {
      font-weight: bold;
    }

    .board-btn .board-title {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }

    .board-btn:hover .board-title {
      color: #ddd;
    }

    /* ─── Catalog controls ───────────────────────────────────────────── */

    .catalog-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .catalog-controls select, .catalog-controls input {
      border: 1px solid var(--accent);
      background: var(--op-bg);
      padding: 4px 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--text);
    }

    .catalog-controls input {
      flex: 1;
      min-width: 180px;
    }

    /* ─── Catalog grid ──────────────────────────────────────────────── */

    #catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .catalog-card {
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 8px;
      cursor: pointer;
    }

    .catalog-card:hover {
      background: var(--reply-bg);
    }

    .catalog-card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
      margin-bottom: 6px;
    }

    .catalog-card .no-image {
      width: 100%;
      height: 110px;
      background: var(--reply-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .catalog-card .card-subject {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 3px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .catalog-card .card-comment {
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    .catalog-card .card-stats {
      font-family: var(--font-ui);
      font-size: 10px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ─── Thread posts (less boxed AI vibe) ───────────────────────────── */

    .post {
      padding: 6px 0;
      margin-bottom: 10px;
      border: none;
    }

    .post.is-op {
      background: transparent;
    }

    .post.is-reply {
      background: transparent;
      margin-left: var(--post-indent);
    }

    .post.is-highlighted {
      outline: 3px solid var(--link-red);
      padding: 6px 10px;
      border-radius: 3px;
      animation: postFlash 1.2s ease-out;
    }

    @keyframes postFlash {
      0%   { filter: brightness(1.15); }
      100% { filter: brightness(1.0); }
    }

    .post-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .post-subject {
      font-weight: bold;
      font-size: 14px;
      color: #2d5a1b;
    }

    .post-name {
      font-weight: bold;
      color: var(--text);
    }

    .post-id {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--muted);
    }

    .post-no {
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--muted);
      cursor: default;
      position: relative;
    }

    .post-no:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .reply-count-badge {
      font-family: var(--font-ui);
      font-size: 10px;
      color: var(--accent);
    }

    .post-body {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }

    .post-image img {
      max-width: 420px;
      max-height: 420px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    .post-video video {
      max-width: 520px;
      max-height: 520px;
      width: 100%;
      height: auto;
      display: block;
    }

    .post-comment {
      flex: 1;
      min-width: 0;
      word-break: break-word;
      line-height: 1.55;
      font-size: 14px;
    }

    .post-comment .quote {
      color: var(--quote-green);
    }

    .post-comment a.quotelink {
      color: var(--link-red);
    }

    .post-comment a.quotelink:hover {
      text-decoration: underline;
    }

    /* ─── Reply popover ──────────────────────────────────────────────── */

    #reply-popover {
      position: fixed;
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      font-family: var(--font-ui);
      font-size: 12px;
      z-index: 200;
      display: none;
      pointer-events: auto;
      max-width: 260px;
      line-height: 1.8;
    }

    #reply-popover .popover-title {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 2px;
    }

    #reply-popover .popover-no {
      color: var(--link-red);
      margin-right: 4px;
      cursor: pointer;
    }

    #reply-popover .popover-no:hover {
      text-decoration: underline;
    }

    /* ─── Lightbox ───────────────────────────────────────────────────── */

    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    #lightbox img, #lightbox video {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
    }

    #lightbox .close {
      position: fixed;
      top: 14px;
      right: 20px;
      font-family: var(--font-ui);
      font-size: 18px;
      color: white;
      cursor: pointer;
      user-select: none;
    }

    /* ─── Settings modal ─────────────────────────────────────────────── */

    #settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .settings-panel {
      width: 100%;
      max-width: 560px;
      background: var(--op-bg);
      border: 1px solid var(--accent);
      padding: 14px 16px;
      border-radius: 6px;
      font-family: var(--font-ui);
    }

    .settings-panel h2 {
      font-size: 14px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .settings-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .settings-row label {
      min-width: 170px;
      font-size: 12px;
      color: var(--muted);
    }

    .settings-row input[type="text"] {
      flex: 1;
      border: 1px solid var(--accent);
      padding: 5px 8px;
      font-family: var(--font-ui);
      font-size: 12px;
      background: white;
    }

    .settings-row input[type="checkbox"] {
      transform: scale(1.1);
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .settings-actions button {
      border: 1px solid var(--accent);
      background: white;
      padding: 5px 10px;
      font-family: var(--font-ui);
      font-size: 12px;
    }

    .settings-actions button:hover {
      background: var(--reply-bg);
    }

  </style>
</head>

<body>

  <div id="header">
    <h1></h1>
    <nav id="breadcrumb"></nav>

    <div id="header-controls">
      <button class="header-btn" onclick="openSettings()">Filters</button>
    </div>
  </div>

  <div id="main">
    <div id="content"></div>
  </div>

  <div id="reply-popover"></div>

  <!-- Lightbox -->
  <div id="lightbox" onclick="closeLightbox()">
    <div class="close">✕</div>
    <div id="lightbox-content"></div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" onclick="closeSettings()">
    <div class="settings-panel" onclick="event.stopPropagation()">
      <h2>Filters / Settings</h2>

      <div class="settings-row">
        <label>Catalog sort default:</label>
        <select id="setting-sort">
          <option value="bump">Bump order</option>
          <option value="replies">Most replies</option>
          <option value="images">Most images</option>
          <option value="newest">Newest thread</option>
          <option value="oldest">Oldest thread</option>
        </select>
      </div>

      <div class="settings-row">
        <label>Catalog search (subject+comment):</label>
        <input id="setting-search" type="text" placeholder="example: linux, wallpaper, etc">
      </div>

      <div class="settings-row">
        <label>Hide threads without subject:</label>
        <input id="setting-hide-nosub" type="checkbox">
      </div>

      <div class="settings-row">
        <label>Hide threads without images:</label>
        <input id="setting-hide-noimg" type="checkbox">
      </div>

      <div class="settings-row">
        <label>Hide threads containing words:</label>
        <input id="setting-blockwords" type="text" placeholder="comma separated: furry, crypto, etc">
      </div>

      <div class="settings-row">
        <label>Thread view: hide posts with no media:</label>
        <input id="setting-thread-mediaonly" type="checkbox">
      </div>

      <div class="settings-actions">
        <button onclick="resetSettings()">Reset</button>
        <button onclick="closeSettings()">Close</button>
        <button onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>


  <script>

    // ─────────────────────────────────────────────────────────────────────────
    // Config
    // ─────────────────────────────────────────────────────────────────────────

    const PROXY = 'https://api.codetabs.com/v1/proxy?quest=';
    const API   = 'https://a.4cdn.org';
    const CDN   = 'https://i.4cdn.org';


    // ─────────────────────────────────────────────────────────────────────────
    // View enum
    // ─────────────────────────────────────────────────────────────────────────

    const View = Object.freeze({
      BOARDS:  'boards',
      CATALOG: 'catalog',
      THREAD:  'thread',
    });


    // ─────────────────────────────────────────────────────────────────────────
    // Settings persistence
    // ─────────────────────────────────────────────────────────────────────────

    const SETTINGS_KEY = 'chanReaderSettings_v1';

    const defaultSettings = {
      catalogSort: 'bump',
      catalogSearch: '',
      hideNoSubject: false,
      hideNoImage: false,
      blockWords: '',
      threadMediaOnly: false,
    };

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return { ...defaultSettings };
        const parsed = JSON.parse(raw);
        return { ...defaultSettings, ...parsed };
      } catch {
        return { ...defaultSettings };
      }
    }

    function persistSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(state.settings));
    }


    // ─────────────────────────────────────────────────────────────────────────
    // App state
    // ─────────────────────────────────────────────────────────────────────────

    const state = {
      view:     View.BOARDS,
      board:    null,
      threadNo: null,
      posts:    [],
      replyMap: {},

      settings: loadSettings(),
    };


    // ─────────────────────────────────────────────────────────────────────────
    // URL builders
    // ─────────────────────────────────────────────────────────────────────────

    const Url = {
      boards:  ()                   => PROXY + encodeURIComponent(`${API}/boards.json`),
      catalog: (board)              => PROXY + encodeURIComponent(`${API}/${board}/catalog.json`),
      thread:  (board, no)          => PROXY + encodeURIComponent(`${API}/${board}/thread/${no}.json`),
      thumb:   (board, tim)         => `${CDN}/${board}/${tim}s.jpg`,
      image:   (board, tim, ext)    => `${CDN}/${board}/${tim}${ext}`,
    };


    // ─────────────────────────────────────────────────────────────────────────
    // apiFetch
    // ─────────────────────────────────────────────────────────────────────────

    async function apiFetch(endpoint) {
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error(`HTTP ${res.status} from ${endpoint}`);
      return res.json();
    }


    // ─────────────────────────────────────────────────────────────────────────
    // buildReplyMap
    // ─────────────────────────────────────────────────────────────────────────

    function buildReplyMap(posts) {
      const map = {};

      for (const post of posts) {
        if (!post.com) continue;

        const matches = post.com.matchAll(/href="#p(\d+)"/g);

        for (const match of matches) {
          const quotedNo = parseInt(match[1], 10);
          if (!map[quotedNo]) map[quotedNo] = [];
          map[quotedNo].push(post.no);
        }
      }

      return map;
    }


    // ─────────────────────────────────────────────────────────────────────────
    // stripHtml
    // ─────────────────────────────────────────────────────────────────────────

    function stripHtml(html) {
      if (!html) return '';
      return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    }


    // ─────────────────────────────────────────────────────────────────────────
    // DOM references
    // ─────────────────────────────────────────────────────────────────────────

    const contentEl    = document.getElementById('content');
    const breadcrumbEl = document.getElementById('breadcrumb');
    const popoverEl    = document.getElementById('reply-popover');


    // ─────────────────────────────────────────────────────────────────────────
    // Content helpers
    // ─────────────────────────────────────────────────────────────────────────

    function setContent(html) {
      contentEl.innerHTML = html;
    }

    function setLoading(message) {
      setContent(`<p class="status-msg">${message}</p>`);
    }

    function setError(message) {
      setContent(`<p class="status-msg is-error">Error: ${message}</p>`);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // updateBreadcrumb
    // ─────────────────────────────────────────────────────────────────────────

    function updateBreadcrumb() {
      const sep   = ' &rsaquo; ';
      const parts = [`<a onclick="goBoards()">Home</a>`];

      if (state.board) {
        parts.push(`<a onclick="goCatalog('${state.board}')">/${state.board}/</a>`);
      }

      if (state.threadNo) {
        parts.push(`Thread #${state.threadNo}`);
      }

      breadcrumbEl.innerHTML = parts.join(sep);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Settings modal UI
    // ─────────────────────────────────────────────────────────────────────────

    function openSettings() {
      const modal = document.getElementById('settings-modal');
      modal.style.display = 'flex';

      document.getElementById('setting-sort').value = state.settings.catalogSort;
      document.getElementById('setting-search').value = state.settings.catalogSearch;
      document.getElementById('setting-hide-nosub').checked = state.settings.hideNoSubject;
      document.getElementById('setting-hide-noimg').checked = state.settings.hideNoImage;
      document.getElementById('setting-blockwords').value = state.settings.blockWords;
      document.getElementById('setting-thread-mediaonly').checked = state.settings.threadMediaOnly;
    }

    function closeSettings() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    function saveSettings() {
      state.settings.catalogSort = document.getElementById('setting-sort').value;
      state.settings.catalogSearch = document.getElementById('setting-search').value.trim();
      state.settings.hideNoSubject = document.getElementById('setting-hide-nosub').checked;
      state.settings.hideNoImage = document.getElementById('setting-hide-noimg').checked;
      state.settings.blockWords = document.getElementById('setting-blockwords').value.trim();
      state.settings.threadMediaOnly = document.getElementById('setting-thread-mediaonly').checked;

      persistSettings();
      closeSettings();

      // Re-render current view with new settings
      if (state.view === View.CATALOG && state.board) goCatalog(state.board);
      if (state.view === View.THREAD && state.threadNo) goThread(state.threadNo);
    }

    function resetSettings() {
      state.settings = { ...defaultSettings };
      persistSettings();
      openSettings();

      if (state.view === View.CATALOG && state.board) goCatalog(state.board);
      if (state.view === View.THREAD && state.threadNo) goThread(state.threadNo);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Boards
    // ─────────────────────────────────────────────────────────────────────────

    async function goBoards() {
      state.view     = View.BOARDS;
      state.board    = null;
      state.threadNo = null;
      updateBreadcrumb();
      setLoading('Loading board list...');

      try {
        const data = await apiFetch(Url.boards());
        renderBoards(data.boards);
      } catch (err) {
        setError(err.message);
      }
    }

    function renderBoards(boards) {
      const worksafe    = boards.filter(b => b.ws_board === 1);
      const notWorksafe = boards.filter(b => b.ws_board === 0);

      function renderGroup(list) {
        return list.map(b => `
          <button class="board-btn" onclick="goCatalog('${b.board}')">
            <span class="board-name">/${b.board}/</span>
            <span class="board-title">${b.title}</span>
          </button>
        `).join('');
      }

      setContent(`
        <div class="board-group">
          <p class="section-label">Worksafe boards (${worksafe.length})</p>
          <div class="board-grid">${renderGroup(worksafe)}</div>
        </div>
        <div class="board-group">
          <p class="section-label">Not worksafe boards (${notWorksafe.length})</p>
          <div class="board-grid">${renderGroup(notWorksafe)}</div>
        </div>
      `);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Catalog filtering + sorting
    // ─────────────────────────────────────────────────────────────────────────

    function matchesBlockWords(thread) {
      const bw = state.settings.blockWords
        .split(',')
        .map(x => x.trim().toLowerCase())
        .filter(Boolean);

      if (bw.length === 0) return true;

      const text = `${thread.sub || ''} ${stripHtml(thread.com || '')}`.toLowerCase();
      return !bw.some(word => text.includes(word));
    }

    function matchesSearch(thread) {
      const q = state.settings.catalogSearch.trim().toLowerCase();
      if (!q) return true;

      const text = `${thread.sub || ''} ${stripHtml(thread.com || '')}`.toLowerCase();
      return text.includes(q);
    }

    function catalogFilterThreads(threads) {
      return threads.filter(t => {
        if (state.settings.hideNoSubject && !t.sub) return false;
        if (state.settings.hideNoImage && !t.tim) return false;
        if (!matchesBlockWords(t)) return false;
        if (!matchesSearch(t)) return false;
        return true;
      });
    }

    function catalogSortThreads(threads) {
      const sort = state.settings.catalogSort;

      if (sort === 'replies') {
        return [...threads].sort((a, b) => (b.replies || 0) - (a.replies || 0));
      }

      if (sort === 'images') {
        return [...threads].sort((a, b) => (b.images || 0) - (a.images || 0));
      }

      if (sort === 'newest') {
        return [...threads].sort((a, b) => (b.no || 0) - (a.no || 0));
      }

      if (sort === 'oldest') {
        return [...threads].sort((a, b) => (a.no || 0) - (b.no || 0));
      }

      return threads;
    }


    // ─────────────────────────────────────────────────────────────────────────
    // goCatalog
    // ─────────────────────────────────────────────────────────────────────────

    async function goCatalog(board) {
      state.view     = View.CATALOG;
      state.board    = board;
      state.threadNo = null;
      updateBreadcrumb();
      setLoading(`Loading /${board}/...`);

      try {
        const pages = await apiFetch(Url.catalog(board));
        const threads = pages.flatMap(page => page.threads);

        const filtered = catalogFilterThreads(threads);
        const sorted   = catalogSortThreads(filtered);

        renderCatalog(sorted, threads.length);
      } catch (err) {
        setError(err.message);
      }
    }

    function renderCatalog(threads, totalCount) {
      const PREVIEW_CHARS = 120;

      const cards = threads.map(t => {
        const imageHtml = t.tim
          ? `<img src="${Url.thumb(state.board, t.tim)}" alt="" loading="lazy">`
          : `<div class="no-image">no image</div>`;

        const subjectHtml = t.sub
          ? `<div class="card-subject">${t.sub}</div>`
          : '';

        const preview = stripHtml(t.com).slice(0, PREVIEW_CHARS);

        return `
          <div class="catalog-card" onclick="goThread(${t.no})">
            ${imageHtml}
            ${subjectHtml}
            <div class="card-comment">${preview}</div>
            <div class="card-stats">${t.replies}R / ${t.images}I</div>
          </div>
        `;
      });

      setContent(`
        <p class="section-label">/${state.board}/ — showing ${threads.length} / ${totalCount} threads</p>

        <div class="catalog-controls">
          <label>Sort:</label>
          <select onchange="setCatalogSort(this.value)">
            <option value="bump"    ${state.settings.catalogSort === 'bump' ? 'selected' : ''}>Bump</option>
            <option value="replies" ${state.settings.catalogSort === 'replies' ? 'selected' : ''}>Replies</option>
            <option value="images"  ${state.settings.catalogSort === 'images' ? 'selected' : ''}>Images</option>
            <option value="newest"  ${state.settings.catalogSort === 'newest' ? 'selected' : ''}>Newest</option>
            <option value="oldest"  ${state.settings.catalogSort === 'oldest' ? 'selected' : ''}>Oldest</option>
          </select>

          <label>Search:</label>
          <input
            type="text"
            placeholder="subject/comment..."
            value="${state.settings.catalogSearch.replace(/"/g, '&quot;')}"
            oninput="setCatalogSearch(this.value)"
          >
        </div>

        <div id="catalog-grid">${cards.join('')}</div>
      `);
    }

    function setCatalogSort(mode) {
      state.settings.catalogSort = mode;
      persistSettings();
      goCatalog(state.board);
    }

    function setCatalogSearch(text) {
      state.settings.catalogSearch = text;
      persistSettings();
      goCatalog(state.board);
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Thread
    // ─────────────────────────────────────────────────────────────────────────

    async function goThread(no) {
      state.view     = View.THREAD;
      state.threadNo = no;
      updateBreadcrumb();
      setLoading(`Loading thread #${no}...`);

      try {
        const data = await apiFetch(Url.thread(state.board, no));
        state.posts    = data.posts;
        state.replyMap = buildReplyMap(data.posts);
        renderThread(data.posts);
      } catch (err) {
        setError(err.message);
      }
    }

    function renderThread(posts) {
      let filteredPosts = posts;

      if (state.settings.threadMediaOnly) {
        filteredPosts = posts.filter(p => !!p.tim);
      }

      const postsHtml = filteredPosts.map(renderPost).join('');

      setContent(`
        <p class="section-label">Thread #${state.threadNo} — ${filteredPosts.length} posts</p>
        ${postsHtml}
      `);

      attachQuotelinkHandlers();
    }

    function renderPost(post) {
      const isOp = post.resto === 0;

      const subjectHtml = post.sub
        ? `<span class="post-subject">${post.sub}</span>`
        : '';

      const idHtml = post.id
        ? `<span class="post-id">ID: ${post.id}</span>`
        : '';

      const repliers    = state.replyMap[post.no];
      const replyCount  = repliers ? repliers.length : 0;
      const replyBadge  = replyCount > 0
        ? `<span class="reply-count-badge">(${replyCount} repl${replyCount === 1 ? 'y' : 'ies'})</span>`
        : '';

      let mediaHtml = '';

      if (post.tim) {
        const fileUrl = Url.image(state.board, post.tim, post.ext);

        if (post.ext === '.webm' || post.ext === '.mp4') {
          mediaHtml = `
            <div class="post-video">
              <video controls preload="metadata" onclick="event.stopPropagation()">
                <source src="${fileUrl}" type="video/${post.ext.slice(1)}">
              </video>
            </div>
          `;
        } else {
          mediaHtml = `
            <div class="post-image">
              <img
                src="${fileUrl}"
                alt="${post.filename || ''}"
                title="${post.filename || ''}${post.ext || ''} (${post.w || ''}x${post.h || ''})"
                onclick="openLightbox('${fileUrl}', '${post.ext}')"
              >
            </div>
          `;
        }
      }

      const commentHtml = post.com
        ? `<div class="post-comment">${post.com}</div>`
        : '';

      return `
        <div class="post ${isOp ? 'is-op' : 'is-reply'}" id="p${post.no}">
          <div class="post-header">
            ${subjectHtml}
            <span class="post-name">${post.name || 'Anonymous'}</span>
            ${idHtml}
            <span class="post-time">${post.now}</span>
            <span
              class="post-no"
              onmouseenter="showPopover(event, ${post.no})"
              onmouseleave="hidePopover()"
            >No.${post.no}</span>
            ${replyBadge}
          </div>

          <div class="post-body">
            ${mediaHtml}
            ${commentHtml}
          </div>
        </div>
      `;
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Quotelinks: click >>1234 jump + highlight
    // ─────────────────────────────────────────────────────────────────────────

    function highlightPost(el) {
      el.classList.add('is-highlighted');
      setTimeout(() => el.classList.remove('is-highlighted'), 1300);
    }

    function jumpToPost(postNo) {
      const target = document.querySelector(`#p${postNo}`);
      if (!target) return;

      target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      highlightPost(target);
    }

    function attachQuotelinkHandlers() {
      contentEl.querySelectorAll('a.quotelink').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();

          const targetId = link.getAttribute('href');
          if (!targetId) return;

          const match = targetId.match(/#p(\d+)/);
          if (!match) return;

          jumpToPost(match[1]);
        });
      });
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Reply popover
    // ─────────────────────────────────────────────────────────────────────────

    function showPopover(event, postNo) {
      const repliers = state.replyMap[postNo];
      if (!repliers || repliers.length === 0) return;

      const noLinks = repliers
        .map(no => `<span class="popover-no" onclick="jumpToPost(${no})">>>${no}</span>`)
        .join(' ');

      popoverEl.innerHTML = `
        <div class="popover-title">Replies to No.${postNo}</div>
        ${noLinks}
      `;

      popoverEl.style.display = 'block';

      const GAP  = 4;
      const rect = event.currentTarget.getBoundingClientRect();

      let x = rect.left;
      let y = rect.bottom + GAP;

      const overflowRight = x + popoverEl.offsetWidth - window.innerWidth;
      if (overflowRight > 0) x -= overflowRight + GAP;

      popoverEl.style.left = `${x}px`;
      popoverEl.style.top  = `${y}px`;
    }

    function hidePopover() {
      popoverEl.style.display = 'none';
    }


    // ─────────────────────────────────────────────────────────────────────────
    // Lightbox
    // ─────────────────────────────────────────────────────────────────────────

    function openLightbox(url, ext) {
      const lightbox = document.getElementById('lightbox');
      const content  = document.getElementById('lightbox-content');

      content.innerHTML = '';

      if (ext === '.webm' || ext === '.mp4') {
        const video = document.createElement('video');
        video.controls = true;
        video.autoplay = true;
        video.innerHTML = `<source src="${url}">`;
        content.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = url;
        content.appendChild(img);
      }

      lightbox.style.display = 'flex';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      const content  = document.getElementById('lightbox-content');

      lightbox.style.display = 'none';
      content.innerHTML = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        closeLightbox();
        closeSettings();
      }
    });


    // ─────────────────────────────────────────────────────────────────────────
    // Boot
    // ─────────────────────────────────────────────────────────────────────────

    goBoards();

  </script>
</body>
</html>
